<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>法语单词</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
:root{
  --bg:#0f1117;--sur:#1a1d27;--sur2:#22263a;--bdr:#2e3350;
  --acc:#c8f03a;--acc2:#4af0c8;--red:#ff4d6d;--ora:#ff9f1c;
  --blu:#4a9eff;--pur:#a78bfa;--txt:#eef0ff;--txt2:#8890b0;
  --r:16px;--f:'Nunito','PingFang SC','Noto Sans SC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--f);background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;}
.screen{display:none;min-height:100vh;flex-direction:column;}
.screen.active{display:flex;}

/* HOME */
.home-header{padding:52px 22px 18px;background:linear-gradient(180deg,#161a2e,var(--bg));}
.home-title{font-size:26px;font-weight:900;color:var(--acc);}
.home-sub{color:var(--txt2);font-size:13px;margin-top:3px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px;margin-top:6px;}
.stat-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.stat-card.g::before{background:var(--acc)}.stat-card.b::before{background:var(--blu)}
.stat-card.r::before{background:var(--red)}.stat-card.p::before{background:var(--pur)}
.stat-num{font-size:30px;font-weight:900;line-height:1;}
.stat-lbl{font-size:11px;color:var(--txt2);margin-top:3px;}
.sec-title{font-size:11px;font-weight:700;color:var(--txt2);letter-spacing:1.5px;text-transform:uppercase;padding:18px 20px 8px;}
.vocab-list{padding:0 20px;display:flex;flex-direction:column;gap:10px;}
.vocab-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .2s,transform .15s;}
.vocab-card:active{transform:scale(0.98);}
.vocab-card.sel{border-color:var(--acc);}
.vc-top{display:flex;align-items:center;justify-content:space-between;}
.vc-name{font-size:16px;font-weight:800;}
.vc-cnt{font-size:12px;color:var(--txt2);}
.vc-bar{height:4px;background:var(--bdr);border-radius:2px;margin-top:10px;overflow:hidden;}
.vc-fill{height:100%;background:var(--acc);border-radius:2px;transition:width .5s;}
.vc-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;}
.tag.e{background:rgba(255,77,109,.15);color:var(--red);}
.tag.h{background:rgba(255,159,28,.15);color:var(--ora);}
.tag.d{background:rgba(200,240,58,.15);color:var(--acc);}
.add-btn{margin:10px 20px;background:var(--sur2);border:1px dashed var(--bdr);border-radius:var(--r);padding:14px;text-align:center;color:var(--txt2);font-size:14px;cursor:pointer;font-family:var(--f);font-weight:700;width:calc(100% - 40px);transition:all .2s;}
.add-btn:hover{border-color:var(--acc);color:var(--acc);}
.group-row{display:flex;align-items:center;gap:12px;padding:0 20px 12px;}
.group-row span{font-size:12px;color:var(--txt2);font-weight:700;}
.gp-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--bdr);background:var(--sur2);color:var(--txt);font-size:18px;cursor:pointer;font-family:var(--f);font-weight:700;}
.gp-num{font-size:22px;font-weight:900;color:var(--acc);min-width:38px;text-align:center;}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px;margin-bottom:16px;}
.mode-btn{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:16px 12px;cursor:pointer;text-align:center;transition:all .2s;font-family:var(--f);}
.mode-btn:active{transform:scale(0.96);}
.mode-btn:disabled{opacity:.35;cursor:not-allowed;}
.mode-btn .mi{font-size:28px;display:block;margin-bottom:6px;}
.mode-btn .mn{font-size:13px;font-weight:800;color:var(--txt);display:block;}
.mode-btn .md{font-size:10px;color:var(--txt2);display:block;margin-top:2px;}
.mode-btn.m1{border-color:var(--acc)}.mode-btn.m2{border-color:var(--acc2)}
.mode-btn.m3{border-color:var(--blu)}.mode-btn.m4{border-color:var(--red)}
.act-row{display:flex;gap:10px;padding:0 20px 36px;}
.act-btn{flex:1;background:var(--sur2);border:1px solid var(--bdr);border-radius:12px;padding:12px;text-align:center;font-size:12px;font-weight:700;color:var(--txt2);cursor:pointer;font-family:var(--f);transition:all .2s;}
.act-btn:hover{color:var(--txt);border-color:var(--txt2);}

/* IMPORT */
#import-screen{padding:52px 20px 32px;gap:14px;}
.imp-hdr{display:flex;align-items:center;gap:12px;}
.back-btn{background:none;border:none;color:var(--txt2);font-size:22px;cursor:pointer;padding:4px;}
.imp-title{font-size:20px;font-weight:900;}
.imp-box{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;}
.imp-lbl{font-size:13px;font-weight:700;color:var(--txt2);}
.imp-input{background:var(--bg);border:1px solid var(--bdr);border-radius:10px;padding:12px;color:var(--txt);font-family:var(--f);font-size:14px;width:100%;transition:border-color .2s;}
.imp-input:focus{outline:none;border-color:var(--acc);}
.file-drop{border:2px dashed var(--bdr);border-radius:14px;padding:28px 16px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg);}
.file-drop:hover,.file-drop.drag{border-color:var(--acc);background:rgba(200,240,58,.05);}
.file-drop-icon{font-size:36px;display:block;margin-bottom:8px;}
.file-drop-text{font-size:14px;font-weight:700;color:var(--txt2);}
.file-drop-sub{font-size:11px;color:var(--txt2);margin-top:4px;opacity:.7;}
.file-name-display{font-size:12px;color:var(--acc);margin-top:6px;font-weight:700;}
.hint-box{background:rgba(200,240,58,.06);border:1px solid rgba(200,240,58,.2);border-radius:10px;padding:12px;font-size:12px;color:var(--txt2);line-height:1.7;}
.hint-box code{color:var(--acc);background:rgba(200,240,58,.1);padding:1px 6px;border-radius:4px;}
.pri-btn{background:var(--acc);color:#000;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:900;cursor:pointer;font-family:var(--f);width:100%;transition:transform .15s,opacity .2s;}
.pri-btn:active{transform:scale(.97);}
.pri-btn:disabled{opacity:.4;cursor:not-allowed;}
#imp-msg{padding:0 4px;font-size:13px;min-height:20px;}

/* GAME */
#game{background:var(--bg);}
.game-hdr{display:flex;align-items:center;justify-content:space-between;padding:48px 18px 12px;background:var(--sur);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:100;}
.game-back{background:none;border:none;color:var(--txt2);font-size:22px;cursor:pointer;padding:4px 8px;font-family:var(--f);}
.game-info{text-align:center;}
.game-mode-name{font-size:11px;font-weight:700;color:var(--txt2);letter-spacing:1px;text-transform:uppercase;}
.game-prog{font-size:13px;font-weight:800;color:var(--txt);margin-top:1px;}
.scene{height:158px;position:relative;overflow:hidden;background:var(--sur);border-bottom:1px solid var(--bdr);flex-shrink:0;}
.scene.study-sc{background:linear-gradient(180deg,#1a2a1a,#0d1a0d);}
.scene.race-sc{background:linear-gradient(180deg,#0a1a3a,#0d1f3d);}
.scene.dict-sc{background:linear-gradient(180deg,#1a1a2e,#0d0d1f);}
.scene.surv-sc{background:linear-gradient(180deg,#2a1a1a,#1a0d0d);}
.sc-track{position:absolute;bottom:28px;left:20px;right:20px;height:6px;background:var(--bdr);border-radius:3px;}
.sc-fill{height:100%;border-radius:3px;transition:width .4s cubic-bezier(.34,1.56,.64,1);}
.sc-marker{position:absolute;bottom:18px;transform:translateX(-50%);font-size:24px;transition:left .4s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));}
.rank-disp{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);border:1px solid var(--bdr);border-radius:20px;padding:4px 16px;font-size:13px;font-weight:800;color:var(--acc);white-space:nowrap;}
.water-rip{position:absolute;bottom:0;left:0;right:0;height:40px;background:repeating-linear-gradient(90deg,rgba(74,158,255,.1) 0,rgba(74,158,255,.05) 20px,transparent 20px,transparent 40px);animation:rip 2s linear infinite;}
@keyframes rip{from{background-position:0 0}to{background-position:40px 0}}
.poop{position:absolute;font-size:20px;animation:poopFall 1s ease-in forwards;pointer-events:none;z-index:50;}
@keyframes poopFall{0%{top:-30px;opacity:1;transform:rotate(0)}80%{opacity:1}100%{top:90px;opacity:0;transform:rotate(360deg)}}
@keyframes catBounce{0%,100%{transform:translateX(-50%) translateY(0)}40%{transform:translateX(-50%) translateY(-18px)}60%{transform:translateX(-50%) translateY(-12px)}}
@keyframes catShake{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-15deg)}75%{transform:translateX(-50%) rotate(15deg)}}
.chase-track{position:absolute;bottom:24px;left:16px;right:16px;height:4px;background:var(--bdr);border-radius:2px;}
.chase-char{position:absolute;bottom:18px;font-size:22px;transform:translateX(-50%);transition:left .5s cubic-bezier(.34,1.56,.64,1);}
.sc-score-pop{position:absolute;font-size:15px;font-weight:900;pointer-events:none;animation:sPop .8s forwards;z-index:60;}
@keyframes sPop{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-36px) scale(1.2)}}
.game-scroll{flex:1;overflow-y:auto;padding-bottom:32px;}
.word-card{margin:16px 20px 12px;background:var(--sur);border:1px solid var(--bdr);border-radius:20px;padding:20px;text-align:center;}
.word-fr{font-size:30px;font-weight:900;color:var(--acc);letter-spacing:-.5px;line-height:1.2;}
.word-hidden{font-size:30px;color:var(--txt2);letter-spacing:4px;}
.word-row{display:flex;align-items:center;justify-content:center;gap:10px;}
.audio-btn{background:none;border:none;font-size:22px;cursor:pointer;padding:4px 8px;border-radius:8px;transition:transform .15s;}
.audio-btn:active{transform:scale(.85);}
.options{padding:0 20px;display:flex;flex-direction:column;gap:10px;}
.opt-btn{background:var(--sur);border:2px solid var(--bdr);border-radius:14px;padding:16px 20px;text-align:left;color:var(--txt);font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;font-family:var(--f);line-height:1.4;display:flex;align-items:center;gap:12px;width:100%;}
.opt-btn:disabled{cursor:default;}
.opt-letter{width:28px;height:28px;border-radius:8px;background:var(--bdr);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;transition:all .15s;}
.opt-btn.correct{border-color:var(--acc);background:rgba(200,240,58,.08);}
.opt-btn.correct .opt-letter{background:var(--acc);color:#000;}
.opt-btn.wrong{border-color:var(--red);background:rgba(255,77,109,.08);}
.opt-btn.wrong .opt-letter{background:var(--red);color:#fff;}
.opt-btn.dim{border-color:var(--bdr);opacity:.35;}
.hes-btn{margin:12px 20px 0;background:none;border:1px solid var(--bdr);border-radius:12px;padding:10px;color:var(--ora);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--f);width:calc(100% - 40px);transition:all .2s;}
.hes-btn:hover{background:rgba(255,159,28,.1);border-color:var(--ora);}
.hes-btn:disabled{opacity:.3;cursor:default;}
.lives-row{display:flex;gap:3px;align-items:center;}
.life{font-size:16px;transition:all .2s;}
.life.lost{filter:grayscale(1) opacity(.3);transform:scale(.8);}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);background:rgba(0,0,0,.88);border-radius:16px;padding:14px 28px;font-size:20px;font-weight:900;opacity:0;pointer-events:none;z-index:999;transition:all .2s;text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.combo-pop{position:fixed;top:30%;left:50%;transform:translateX(-50%);font-size:24px;font-weight:900;color:var(--acc);pointer-events:none;z-index:998;animation:cPop .8s forwards;}
@keyframes cPop{0%{opacity:0;transform:translateX(-50%) translateY(0) scale(.5)}30%{opacity:1;transform:translateX(-50%) translateY(-10px) scale(1.2)}100%{opacity:0;transform:translateX(-50%) translateY(-40px) scale(1)}}
.result-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:200;padding:28px;animation:fadeIn .3s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.res-emoji{font-size:72px;animation:bounceIn .5s;}
@keyframes bounceIn{0%{transform:scale(.3)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.res-title{font-size:24px;font-weight:900;text-align:center;}
.res-sub{font-size:14px;color:var(--txt2);text-align:center;line-height:1.6;}
.res-stats{display:flex;gap:16px;background:var(--sur);border-radius:16px;padding:14px 22px;border:1px solid var(--bdr);}
.rs{text-align:center;}
.rs-num{font-size:22px;font-weight:900;}
.rs-lbl{font-size:10px;color:var(--txt2);margin-top:2px;}
.res-btn{background:var(--acc);color:#000;border:none;border-radius:14px;padding:14px 32px;font-size:16px;font-weight:900;cursor:pointer;font-family:var(--f);width:100%;transition:transform .15s;}
.res-btn:active{transform:scale(.97);}
.res-btn.sec{background:var(--sur2);color:var(--txt);border:1px solid var(--bdr);margin-top:-4px;}
.confetti-piece{position:fixed;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:999;animation:confFall var(--dur) ease-in forwards;}
@keyframes confFall{0%{top:-20px;transform:rotate(0) translateX(0);opacity:1}100%{top:110vh;transform:rotate(720deg) translateX(var(--drift));opacity:0}}
@media(min-width:600px){
  .home-header,.stats-grid,.sec-title,.vocab-list,.add-btn,.mode-grid,.act-row,.group-row{max-width:580px;margin-left:auto;margin-right:auto;}
  .stats-grid,.vocab-list,.mode-grid,.act-row,.group-row{padding-left:28px;padding-right:28px;}
  .game-scroll,.scene,.game-hdr{max-width:520px;margin-left:auto;margin-right:auto;width:100%;}
  .word-fr{font-size:34px;}
}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px;}
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="home-header">
    <div class="home-title">🐱 法语单词</div>
    <div class="home-sub">选一本生词本，开始今天的练习</div>
  </div>
  <div class="stats-grid">
    <div class="stat-card g"><div class="stat-num" id="st-total">0</div><div class="stat-lbl">词库总数</div></div>
    <div class="stat-card b"><div class="stat-num" id="st-done">0</div><div class="stat-lbl">已掌握</div></div>
    <div class="stat-card r"><div class="stat-num" id="st-err">0</div><div class="stat-lbl">错词</div></div>
    <div class="stat-card p"><div class="stat-num" id="st-hes">0</div><div class="stat-lbl">犹豫词</div></div>
  </div>
  <div class="sec-title">我的生词本</div>
  <div class="vocab-list" id="vocab-list"></div>
  <button class="add-btn" onclick="showImport()">＋ 导入新生词本（xlsx / csv）</button>
  <div class="sec-title">选择模式</div>
  <div class="group-row">
    <span>每组词数</span>
    <button class="gp-btn" onclick="chgGroup(-1)">－</button>
    <div class="gp-num" id="gp-num">15</div>
    <button class="gp-btn" onclick="chgGroup(1)">＋</button>
  </div>
  <div class="mode-grid">
    <button class="mode-btn m1" onclick="startGame('study')" id="btn-study" disabled>
      <span class="mi">🐱</span><span class="mn">背单词</span><span class="md">猫猫助学·错词重来</span>
    </button>
    <button class="mode-btn m2" onclick="startGame('race')" id="btn-race" disabled>
      <span class="mi">🐉</span><span class="mn">赛龙舟</span><span class="md">竞速排名·天降鸟屎</span>
    </button>
    <button class="mode-btn m3" onclick="startGame('dictation')" id="btn-dictation" disabled>
      <span class="mi">🚔</span><span class="mn">听写模式</span><span class="md">只播发音·警察追小偷</span>
    </button>
    <button class="mode-btn m4" onclick="startGame('survival')" id="btn-survival" disabled>
      <span class="mi">🐈</span><span class="mn">生存模式</span><span class="md">9条命·坚持到底</span>
    </button>
  </div>
  <div class="act-row">
    <button class="act-btn" onclick="exportData()">📤 导出进度</button>
    <button class="act-btn" onclick="triggerImportJSON()">📥 导入进度</button>
    <input type="file" id="json-file" accept=".json" style="display:none" onchange="loadJSON(event)">
  </div>
</div>

<!-- IMPORT SCREEN -->
<div id="import-screen" class="screen">
  <div style="padding:52px 20px 24px;display:flex;flex-direction:column;gap:14px;">
    <div class="imp-hdr">
      <button class="back-btn" onclick="showHome()">←</button>
      <div class="imp-title">导入生词本</div>
    </div>
    <div class="imp-box">
      <div class="imp-lbl">生词本名称</div>
      <input class="imp-input" id="vname" placeholder="例：听力词汇、阅读词汇…" maxlength="20">
      <div class="imp-lbl">上传文件（xlsx 或 csv）</div>
      <div class="file-drop" id="file-drop" onclick="document.getElementById('xlsx-file').click()"
        ondragover="event.preventDefault();this.classList.add('drag')"
        ondragleave="this.classList.remove('drag')"
        ondrop="handleDrop(event)">
        <span class="file-drop-icon">📂</span>
        <div class="file-drop-text">点击选择文件 或 拖拽到这里</div>
        <div class="file-drop-sub">支持 .xlsx · .xls · .csv</div>
        <div class="file-name-display" id="fname-display"></div>
      </div>
      <input type="file" id="xlsx-file" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleFileSelect(event)">
      <div class="hint-box">
        📋 Excel格式：<code>A列</code> 法语，<code>B列</code> 中文<br>
        第一行可以是标题行（自动跳过）<br>
        CSV同样支持，逗号或Tab分隔均可
      </div>
      <button class="pri-btn" id="imp-btn" onclick="doImport()" disabled>导入</button>
    </div>
    <div id="imp-msg"></div>
  </div>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="game-hdr">
    <button class="game-back" onclick="exitGame()">←</button>
    <div class="game-info">
      <div class="game-mode-name" id="g-mode-lbl"></div>
      <div class="game-prog" id="g-prog"></div>
    </div>
    <div id="g-right"></div>
  </div>
  <div class="scene" id="g-scene"></div>
  <div class="game-scroll">
    <div class="word-card">
      <div class="word-row">
        <div id="word-disp" class="word-fr"></div>
        <button class="audio-btn" onclick="playAudio()">🔊</button>
      </div>
    </div>
    <div class="options" id="opts"></div>
    <button class="hes-btn" id="hes-btn" onclick="markHesitant()">🤔 不确定（标记犹豫）</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="result-root"></div>

<script>
// ══════ DATA ══════
let DB = { books:[], selBook:null, groupSize:15 };
function saveDB(){ try{ localStorage.setItem('frVocab3', JSON.stringify(DB)); }catch(e){} }
function loadDB(){ try{ const r=localStorage.getItem('frVocab3'); if(r) DB=JSON.parse(r); if(!DB.groupSize) DB.groupSize=15; if(!DB.books) DB.books=[]; }catch(e){} }
loadDB();
function getBook(id){ return DB.books.find(b=>b.id===id); }
function curBook(){ return getBook(DB.selBook); }

// ══════ FILE PARSING ══════
let pendingWords = [];

function handleDrop(e){
  e.preventDefault();
  document.getElementById('file-drop').classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if(f) processFile(f);
}
function handleFileSelect(e){ const f=e.target.files[0]; if(f) processFile(f); }

function processFile(file){
  const name = file.name.toLowerCase();
  document.getElementById('fname-display').textContent = '📄 ' + file.name;
  const reader = new FileReader();
  if(name.endsWith('.csv')){
    reader.onload = ev => parseCSV(ev.target.result);
    reader.readAsText(file, 'UTF-8');
  } else {
    reader.onload = ev => parseXLSX(ev.target.result);
    reader.readAsArrayBuffer(file);
  }
}

function parseXLSX(buf){
  try {
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    extractWords(rows);
  } catch(e){ showMsg('⚠️ 文件解析失败: ' + e.message, false); }
}

function parseCSV(text){
  const lines = text.split('\n').filter(l=>l.trim());
  const rows = lines.map(l=>{
    // try tab first, then comma
    const parts = l.includes('\t') ? l.split('\t') : l.split(',');
    return parts.map(p=>p.trim().replace(/^"|"$/g,''));
  });
  extractWords(rows);
}

function extractWords(rows){
  pendingWords = [];
  let skipped = 0;
  rows.forEach((row, i)=>{
    if(!row || row.length < 2) return;
    const fr = String(row[0]||'').trim();
    const zh = String(row[1]||'').trim();
    if(!fr || !zh) return;
    // skip header-like rows
    if(i===0 && (fr.toLowerCase()==='français'||fr.toLowerCase()==='法语'||fr.toLowerCase()==='french'||fr==='A')) { skipped++; return; }
    pendingWords.push({ id: Date.now()+i, fr, zh, seenCount:0, masteryCount:0 });
  });
  if(pendingWords.length===0){
    showMsg('⚠️ 没有识别到词条，请检查文件格式', false);
    document.getElementById('imp-btn').disabled = true;
  } else {
    showMsg(`✅ 识别到 ${pendingWords.length} 个词条，跳过 ${skipped} 行`, true);
    document.getElementById('imp-btn').disabled = false;
  }
}

function showMsg(txt, ok){
  const el = document.getElementById('imp-msg');
  el.textContent = txt;
  el.style.color = ok ? 'var(--acc)' : 'var(--red)';
}

function doImport(){
  const name = document.getElementById('vname').value.trim();
  if(!name){ showMsg('⚠️ 请输入生词本名称', false); return; }
  if(!pendingWords.length){ showMsg('⚠️ 请先上传文件', false); return; }
  const book = { id:Date.now(), name, words:pendingWords, errors:[], hesitants:[] };
  DB.books.push(book);
  DB.selBook = book.id;
  saveDB();
  pendingWords = [];
  document.getElementById('vname').value = '';
  document.getElementById('fname-display').textContent = '';
  document.getElementById('imp-btn').disabled = true;
  document.getElementById('imp-msg').textContent = '';
  document.getElementById('xlsx-file').value = '';
  showHome();
  showToast(`导入成功：${book.words.length} 个词 🎉`);
}

// ══════ HOME ══════
function showImport(){ switchScreen('import-screen'); }
function showHome(){ switchScreen('home'); renderHome(); }

function renderHome(){
  let total=0,done=0,err=0,hes=0;
  DB.books.forEach(b=>{
    total+=b.words.length;
    done+=b.words.filter(w=>w.masteryCount>=3).length;
    err+=b.errors.length; hes+=b.hesitants.length;
  });
  document.getElementById('st-total').textContent=total;
  document.getElementById('st-done').textContent=done;
  document.getElementById('st-err').textContent=err;
  document.getElementById('st-hes').textContent=hes;
  document.getElementById('gp-num').textContent=DB.groupSize;

  const list=document.getElementById('vocab-list');
  list.innerHTML='';
  DB.books.forEach(book=>{
    const d=book.words.filter(w=>w.masteryCount>=3).length;
    const pct=book.words.length?Math.round(d/book.words.length*100):0;
    const div=document.createElement('div');
    div.className='vocab-card'+(DB.selBook===book.id?' sel':'');
    div.innerHTML=`
      <div class="vc-top"><div class="vc-name">${book.name}</div><div class="vc-cnt">${book.words.length}词·${pct}%</div></div>
      <div class="vc-bar"><div class="vc-fill" style="width:${pct}%"></div></div>
      <div class="vc-tags">
        ${book.errors.length?`<span class="tag e">错词 ${book.errors.length}</span>`:''}
        ${book.hesitants.length?`<span class="tag h">犹豫 ${book.hesitants.length}</span>`:''}
        ${d?`<span class="tag d">已掌握 ${d}</span>`:''}
      </div>`;
    div.onclick=()=>selBook(book.id,div);
    list.appendChild(div);
  });

  const has=DB.books.length>0&&DB.selBook&&curBook();
  ['btn-study','btn-race','btn-dictation','btn-survival'].forEach(id=>{
    document.getElementById(id).disabled=!has;
  });
}

function selBook(id,el){
  DB.selBook=id; saveDB();
  document.querySelectorAll('.vocab-card').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  renderHome();
}

function chgGroup(d){
  DB.groupSize=Math.min(30,Math.max(12,DB.groupSize+d));
  saveDB();
  document.getElementById('gp-num').textContent=DB.groupSize;
}

// ══════ AUDIO ══════
let curWord='';
function playAudio(w){
  const word=w||curWord; if(!word) return;
  // Try Google TTS
  const audio=new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(word)}&tl=fr&client=tw-ob`);
  audio.play().catch(()=>fallbackTTS(word));
}
function fallbackTTS(word){
  if(!window.speechSynthesis) return;
  const u=new SpeechSynthesisUtterance(word);
  u.lang='fr-FR'; u.rate=0.9;
  const voices=speechSynthesis.getVoices();
  const v=voices.find(v=>v.lang.startsWith('fr')&&/female|femme/i.test(v.name))
    ||voices.find(v=>v.lang.startsWith('fr'));
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}

// ══════ GAME ══════
let G={};

function shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }

function getOpts(correct,pool){
  const others=shuffle(pool.filter(w=>w.id!==correct.id)).slice(0,3);
  return shuffle([correct,...others]);
}

function startGame(mode){
  const book=curBook(); if(!book) return;
  if(book.words.length<4){ showToast('至少需要4个词！⚠️'); return; }

  const unseen=book.words.filter(w=>w.seenCount===0);
  const seen=book.words.filter(w=>w.seenCount>0&&w.masteryCount<3);
  const mastered=book.words.filter(w=>w.masteryCount>=3);
  let pool;
  if(mode==='study'){
    pool=[...shuffle(unseen),...shuffle(seen),...shuffle(mastered)].slice(0,DB.groupSize);
  } else {
    pool=shuffle(book.words).slice(0,DB.groupSize);
  }
  if(pool.length<4){ showToast('词库不足4个词！'); return; }

  G={ mode, bookId:book.id, pool, allWords:book.words,
      current:0, answered:false, combo:0,
      wrongIds:new Set(), hesitantIds:new Set(),
      reviewQueue:[], inReview:false,
      rank:200+Math.floor(Math.random()*50), score:0,
      lives:9, thiefPos:0, policePos:0, total:pool.length };

  switchScreen('game');
  setupScene(mode);
  renderQ();
  initGamepad();
}

function setupScene(mode){
  const modeNames={study:'背单词',race:'赛龙舟',dictation:'听写模式',survival:'生存模式'};
  document.getElementById('g-mode-lbl').textContent=modeNames[mode]||mode;
  const scene=document.getElementById('g-scene');

  if(mode==='study'){
    scene.className='scene study-sc';
    scene.innerHTML=`<div class="rank-disp" id="sc-info">第1题</div>
      <div class="sc-track"><div class="sc-fill" id="sc-fill" style="background:var(--acc);width:0%"></div></div>
      <div class="sc-marker" id="cat-m" style="left:4%">🐱</div>`;
  } else if(mode==='race'){
    scene.className='scene race-sc';
    scene.innerHTML=`<div class="water-rip"></div>
      <div class="rank-disp" id="rank-lbl">🏆 第${G.rank}名</div>
      <div class="sc-track"><div class="sc-fill" id="sc-fill" style="background:var(--acc2);width:0%"></div></div>
      <div class="sc-marker" id="boat-m" style="left:4%">🚣</div>`;
    G.poopTimer=setInterval(maybeDropPoop,4000+Math.random()*4000);
  } else if(mode==='dictation'){
    scene.className='scene dict-sc';
    scene.innerHTML=`<div class="chase-track"></div>
      <div class="chase-char" id="thief-c" style="left:12%">🏃</div>
      <div class="chase-char" id="police-c" style="left:4%">🚔</div>
      <div style="position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--txt2);font-weight:700;white-space:nowrap;">答对小偷逃远·答错警察追近</div>`;
  } else if(mode==='survival'){
    scene.className='scene surv-sc';
    scene.innerHTML=`<div class="rank-disp" id="sc-info">第1题</div>
      <div id="lives-disp" style="position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:3px;"></div>
      <div class="sc-marker" id="cat-m" style="left:50%;bottom:32px">🐈</div>`;
    renderLives();
  }

  const ri=document.getElementById('g-right');
  ri.innerHTML=`<div style="font-size:12px;color:var(--txt2);font-weight:700;" id="combo-disp"></div>`;
}

function renderLives(){
  const d=document.getElementById('lives-disp'); if(!d) return;
  d.innerHTML='';
  for(let i=0;i<9;i++){
    const s=document.createElement('span');
    s.className='life'+(i>=G.lives?' lost':'');
    s.textContent='🐾'; d.appendChild(s);
  }
}

function renderQ(){
  const queue=G.inReview?G.reviewQueue:G.pool;
  const word=queue[G.current];
  if(!word){ endRound(); return; }
  G.answered=false;
  curWord=word.fr;

  const idx=G.inReview?G.pool.length+G.current:G.current;
  const total=G.pool.length+(G.inReview?G.reviewQueue.length:0);
  document.getElementById('g-prog').textContent=G.inReview?`复习 ${G.current+1}/${G.reviewQueue.length}`:`${G.current+1} / ${G.pool.length}`;

  updateScene(word,idx,total);

  const disp=document.getElementById('word-disp');
  if(G.mode==='dictation'){
    disp.textContent='🎧'; disp.className='word-hidden';
  } else {
    disp.textContent=word.fr; disp.className='word-fr';
  }
  setTimeout(()=>playAudio(word.fr),300);

  const opts=getOpts(word,G.allWords);
  const container=document.getElementById('opts');
  container.innerHTML='';
  ['A','B','C','D'].forEach((lbl,i)=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.setAttribute('data-id',opts[i].id);
    btn.innerHTML=`<span class="opt-letter">${lbl}</span><span>${opts[i].zh}</span>`;
    btn.onclick=()=>selectOpt(opts[i],word,btn);
    container.appendChild(btn);
  });

  const hb=document.getElementById('hes-btn');
  hb.disabled=false; hb.style.opacity='1';
}

function updateScene(word,idx,total){
  const pct=total>1?(idx/(total-1))*100:0;
  const fill=document.getElementById('sc-fill');
  if(fill) fill.style.width=pct+'%';

  if(G.mode==='study'){
    const cat=document.getElementById('cat-m');
    if(cat) cat.style.left=Math.min(90,4+pct*.86)+'%';
    const info=document.getElementById('sc-info');
    if(info) info.textContent=`第${idx+1}/${total}题`;
  } else if(G.mode==='race'){
    const boat=document.getElementById('boat-m');
    if(boat) boat.style.left=Math.min(90,4+pct*.86)+'%';
    const rl=document.getElementById('rank-lbl');
    if(rl) rl.textContent=`🏆 第${G.rank}名`;
  } else if(G.mode==='dictation'){
    updateChase();
  } else if(G.mode==='survival'){
    const info=document.getElementById('sc-info');
    if(info) info.textContent=`第${G.current+1}题`;
  }
}

function updateChase(){
  const t=document.getElementById('thief-c'),p=document.getElementById('police-c');
  if(t) t.style.left=Math.min(92,12+G.thiefPos*.80)+'%';
  if(p) p.style.left=Math.min(85,4+G.policePos*.81)+'%';
}

function selectOpt(opt,word,btn){
  if(G.answered) return;
  G.answered=true;
  const correct=opt.id===word.id;
  document.querySelectorAll('.opt-btn').forEach(b=>{
    const bid=parseInt(b.getAttribute('data-id'));
    b.disabled=true;
    if(bid===word.id) b.classList.add('correct');
    else if(b===btn&&!correct) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  document.getElementById('hes-btn').disabled=true;

  const bw=getBook(G.bookId).words.find(w=>w.id===word.id);
  if(bw) bw.seenCount++;

  if(correct){
    G.combo++;
    if(bw) bw.masteryCount=Math.min(bw.masteryCount+1,5);
    updateErrStreak(word.id,true);
    showCombo(G.combo);
    animateCat('bounce');
    if(G.mode==='race'){ const rg=Math.max(1,3-Math.floor(G.rank/100)); G.rank=Math.max(1,G.rank-rg); showScorePop('+'+rg+'名','var(--acc)'); }
    else if(G.mode==='dictation'){ G.thiefPos=Math.min(100,G.thiefPos+8); updateChase(); }
  } else {
    G.combo=0;
    G.wrongIds.add(word.id);
    if(bw) bw.masteryCount=0;
    addToErrors(word.id);
    updateErrStreak(word.id,false);
    animateCat('shake');
    if(G.mode==='dictation'){ G.policePos=Math.min(100,G.policePos+6); updateChase(); }
    else if(G.mode==='survival'){ G.lives--; renderLives(); if(G.lives<=0){ saveDB(); setTimeout(()=>showResult(false),700); return; } }
  }

  const cd=document.getElementById('combo-disp');
  if(cd) cd.textContent=G.combo>=2?`🔥 ${G.combo}连`:'';
  saveDB();

  setTimeout(()=>{
    G.current++;
    const queue=G.inReview?G.reviewQueue:G.pool;
    if(G.current>=queue.length){
      if(!G.inReview&&(G.wrongIds.size>0||G.hesitantIds.size>0)&&G.mode==='study') startReview();
      else endRound();
    } else renderQ();
  }, 950);
}

function markHesitant(){
  const q=G.inReview?G.reviewQueue:G.pool;
  const word=q[G.current];
  if(!word||G.answered) return;
  G.hesitantIds.add(word.id);
  addToHesitants(word.id);
  showToast('已标记犹豫 🤔');
  const hb=document.getElementById('hes-btn');
  hb.disabled=true; hb.style.opacity='.4';
  saveDB();
}

function startReview(){
  const book=getBook(G.bookId);
  const ids=[...G.wrongIds,...G.hesitantIds];
  G.reviewQueue=shuffle(book.words.filter(w=>ids.includes(w.id)));
  G.inReview=true; G.current=0;
  G.wrongIds.clear();
  showToast('复习错词和犹豫词！🔁');
  setTimeout(renderQ,900);
}

function endRound(){
  if(G.poopTimer) clearInterval(G.poopTimer);
  if(G.mode==='dictation'){
    showResult(G.policePos<G.thiefPos, G.policePos>=G.thiefPos?'被抓住了！':'成功逃脱！🏃');
  } else showResult(true);
}

function addToErrors(wid){
  const book=getBook(G.bookId); if(!book) return;
  const word=book.words.find(w=>w.id===wid); if(!word) return;
  if(!book.errors.find(e=>e.id===wid)) book.errors.push({...word,streak:0});
}
function addToHesitants(wid){
  const book=getBook(G.bookId); if(!book) return;
  const word=book.words.find(w=>w.id===wid); if(!word) return;
  if(!book.hesitants.find(e=>e.id===wid)) book.hesitants.push({...word,streak:0});
}
function updateErrStreak(wid,correct){
  const book=getBook(G.bookId); if(!book) return;
  ['errors','hesitants'].forEach(key=>{
    const idx=book[key].findIndex(e=>e.id===wid); if(idx===-1) return;
    if(correct){
      book[key][idx].streak=(book[key][idx].streak||0)+1;
      if(book[key][idx].streak>=3){ book[key].splice(idx,1); showToast('移出词本 🎉'); }
    } else { book[key][idx].streak=0; }
  });
}

// poop
function maybeDropPoop(){ if(Math.random()<0.45) dropPoop(); }
function dropPoop(){
  const scene=document.getElementById('g-scene'); if(!scene) return;
  const p=document.createElement('div'); p.className='poop'; p.textContent='💩';
  p.style.left=(10+Math.random()*80)+'%'; scene.appendChild(p);
  if(!G.answered&&G.mode==='race'){
    G.rank=Math.min(999,G.rank+Math.floor(1+Math.random()*3));
    const rl=document.getElementById('rank-lbl'); if(rl) rl.textContent=`🏆 第${G.rank}名`;
    showScorePop('💩 掉排名','var(--red)');
  }
  setTimeout(()=>p.remove(),1050);
}

// animations
function animateCat(type){
  const cat=document.getElementById('cat-m'); if(!cat) return;
  cat.style.animation='none'; cat.offsetHeight;
  if(type==='bounce') cat.style.animation='catBounce .5s ease';
  else if(type==='shake') cat.style.animation='catShake .4s ease';
}
function showCombo(n){
  if(n<2) return;
  const el=document.createElement('div'); el.className='combo-pop';
  el.textContent=`🔥 ${n}连击！`; document.body.appendChild(el);
  setTimeout(()=>el.remove(),900);
}
function showScorePop(txt,color){
  const scene=document.getElementById('g-scene'); if(!scene) return;
  const el=document.createElement('div'); el.className='sc-score-pop';
  el.textContent=txt; el.style.color=color;
  el.style.left=(25+Math.random()*50)+'%'; el.style.top='20px';
  scene.appendChild(el); setTimeout(()=>el.remove(),900);
}
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1300);
}
function spawnConfetti(){
  const cols=['var(--acc)','var(--acc2)','var(--pur)','var(--ora)','var(--blu)'];
  for(let i=0;i<40;i++){
    const el=document.createElement('div'); el.className='confetti-piece';
    el.style.cssText=`left:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*cols.length)]};--dur:${.8+Math.random()*1.2}s;--drift:${(Math.random()-.5)*200}px;animation-delay:${Math.random()*.5}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;`;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
  }
}

function showResult(win,subtitle=''){
  if(G.poopTimer) clearInterval(G.poopTimer);
  const book=getBook(G.bookId);
  const errC=book?book.errors.length:0, hesC=book?book.hesitants.length:0;
  const modeWin={study:'本组完成！',race:`冲到第${G.rank}名！`,dictation:subtitle||'完成！',survival:`坚持了${G.current}题！`};
  const root=document.getElementById('result-root');
  root.innerHTML=`<div class="result-overlay">
    <div class="res-emoji">${win?(G.mode==='study'?'🐱':G.mode==='race'?'🏆':G.mode==='dictation'?'🏃':'🐈'):'😿'}</div>
    <div class="res-title">${win?modeWin[G.mode]:(G.mode==='survival'?`坚持了${G.current}题`:subtitle||'加油！')}</div>
    <div class="res-sub">${errC?`错词本：${errC}个`:'无错词 🎉'}${hesC?` · 犹豫：${hesC}个`:''}</div>
    <div class="res-stats">
      <div class="rs"><div class="rs-num" style="color:var(--acc)">${G.total}</div><div class="rs-lbl">本组题数</div></div>
      <div class="rs"><div class="rs-num" style="color:var(--red)">${G.wrongIds?G.wrongIds.size:0}</div><div class="rs-lbl">答错</div></div>
      <div class="rs"><div class="rs-num" style="color:var(--ora)">${G.hesitantIds?G.hesitantIds.size:0}</div><div class="rs-lbl">犹豫</div></div>
      <div class="rs"><div class="rs-num" style="color:var(--pur)">${G.combo}</div><div class="rs-lbl">最长连击</div></div>
    </div>
    <button class="res-btn" onclick="restartGame()">再来一组</button>
    <button class="res-btn sec" onclick="exitGame()">返回主页</button>
  </div>`;
  if(win) setTimeout(spawnConfetti,100);
}

function restartGame(){ document.getElementById('result-root').innerHTML=''; startGame(G.mode); }
function exitGame(){
  if(G.poopTimer) clearInterval(G.poopTimer);
  document.getElementById('result-root').innerHTML='';
  switchScreen('home'); renderHome();
}

// ══════ GAMEPAD ══════
let gpLoop=null, lastBtns=[];
function initGamepad(){
  if(gpLoop) cancelAnimationFrame(gpLoop);
  function loop(){
    const gps=navigator.getGamepads?navigator.getGamepads():[];
    for(const gp of gps){
      if(!gp) continue;
      gp.buttons.forEach((btn,i)=>{
        if(btn.pressed&&!lastBtns[i]) onGPBtn(i);
        lastBtns[i]=btn.pressed;
      });
    }
    gpLoop=requestAnimationFrame(loop);
  }
  gpLoop=requestAnimationFrame(loop);
}
function onGPBtn(idx){
  const opts=document.querySelectorAll('.opt-btn:not([disabled])');
  const map={2:0,1:1,3:2,0:3};
  if(map[idx]!==undefined&&opts[map[idx]]) opts[map[idx]].click();
  else if(idx===5) playAudio();
  else if(idx===4){ const hb=document.getElementById('hes-btn'); if(hb&&!hb.disabled) hb.click(); }
}

// ══════ EXPORT/IMPORT ══════
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`法语进度_${new Date().toISOString().slice(0,10)}.json`; a.click();
}
function triggerImportJSON(){ document.getElementById('json-file').click(); }
function loadJSON(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{ try{ const d=JSON.parse(ev.target.result); if(d.books){DB=d;saveDB();renderHome();showToast('进度导入成功 ✅');} }catch(err){showToast('文件格式错误 ⚠️');} };
  reader.readAsText(file);
}

// ══════ SCREEN ══════
function switchScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

// init
renderHome();
if(window.speechSynthesis){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }
