<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Écoute Chérie</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
:root{
  --bg:#0f1117;--sur:#1a1d27;--sur2:#22263a;--bdr:#2e3350;
  --acc:#c8f03a;--acc2:#4af0c8;--red:#ff4d6d;--ora:#ff9f1c;
  --blu:#4a9eff;--pur:#a78bfa;--txt:#eef0ff;--txt2:#8890b0;
  --r:16px;--f:'Nunito','PingFang SC','Noto Sans SC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--f);background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;}
.screen{display:none;min-height:100vh;flex-direction:column;}
.screen.active{display:flex;}

/* ── HOME ── */
.home-header{padding:52px 22px 18px;background:linear-gradient(180deg,#161a2e,var(--bg));}
.home-title{font-size:26px;font-weight:900;color:var(--acc);font-style:normal;}
.home-sub{color:var(--txt2);font-size:13px;margin-top:3px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px;margin-top:6px;}
.stat-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.stat-card.g::before{background:var(--acc)}.stat-card.b::before{background:var(--blu)}
.stat-card.r::before{background:var(--red)}.stat-card.p::before{background:var(--pur)}
.stat-num{font-size:30px;font-weight:900;line-height:1;}
.stat-lbl{font-size:11px;color:var(--txt2);margin-top:3px;}
.sec-title{font-size:11px;font-weight:700;color:var(--txt2);letter-spacing:1.5px;text-transform:uppercase;padding:18px 20px 8px;}
.vocab-list{padding:0 20px;display:flex;flex-direction:column;gap:10px;}
.vocab-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .2s,transform .15s;}
.vocab-card:active{transform:scale(.98);}
.vocab-card.sel{border-color:var(--acc);}
.vc-top{display:flex;align-items:center;justify-content:space-between;}
.vc-name{font-size:16px;font-weight:800;}
.vc-cnt{font-size:12px;color:var(--txt2);}
.vc-bar{height:4px;background:var(--bdr);border-radius:2px;margin-top:10px;overflow:hidden;}
.vc-fill{height:100%;background:var(--acc);border-radius:2px;transition:width .5s;}
.vc-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;}
.tag.e{background:rgba(255,77,109,.15);color:var(--red);}
.tag.h{background:rgba(255,159,28,.15);color:var(--ora);}
.tag.d{background:rgba(200,240,58,.15);color:var(--acc);}
.add-btn{margin:10px 20px;background:var(--sur2);border:1px dashed var(--bdr);border-radius:var(--r);padding:14px;text-align:center;color:var(--txt2);font-size:14px;cursor:pointer;font-family:var(--f);font-weight:700;width:calc(100% - 40px);transition:all .2s;}
.add-btn:hover{border-color:var(--acc);color:var(--acc);}
.group-row{display:flex;align-items:center;gap:12px;padding:0 20px 12px;flex-wrap:wrap;}
.group-row span{font-size:12px;color:var(--txt2);font-weight:700;}
.gp-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--bdr);background:var(--sur2);color:var(--txt);font-size:18px;cursor:pointer;font-family:var(--f);font-weight:700;}
.gp-num{font-size:22px;font-weight:900;color:var(--acc);min-width:38px;text-align:center;}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px;margin-bottom:16px;}
.mode-btn{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:16px 12px;cursor:pointer;text-align:center;transition:all .2s;font-family:var(--f);position:relative;overflow:hidden;}
.mode-btn:active{transform:scale(.96);}
.mode-btn:disabled{opacity:.35;cursor:not-allowed;}
.mode-btn .mi{font-size:28px;display:block;margin-bottom:6px;}
.mode-btn .mn{font-size:13px;font-weight:800;color:var(--txt);display:block;}
.mode-btn .md{font-size:10px;color:var(--txt2);display:block;margin-top:2px;}
.mode-btn.m1{border-color:var(--acc)}.mode-btn.m2{border-color:var(--acc2)}
.mode-btn.m3{border-color:var(--blu)}.mode-btn.m4{border-color:var(--red)}
.mode-btn.m5{border-color:#7ad97a}.mode-btn.m6{border-color:var(--ora)}
.act-row{display:flex;gap:10px;padding:0 20px 36px;}
.act-btn{flex:1;background:var(--sur2);border:1px solid var(--bdr);border-radius:12px;padding:12px;text-align:center;font-size:12px;font-weight:700;color:var(--txt2);cursor:pointer;font-family:var(--f);transition:all .2s;}
.act-btn:hover{color:var(--txt);border-color:var(--txt2);}

/* ── IMPORT ── */
#import-screen{padding:52px 20px 32px;gap:14px;}
.imp-hdr{display:flex;align-items:center;gap:12px;}
.back-btn{background:none;border:none;color:var(--txt2);font-size:22px;cursor:pointer;padding:4px;}
.imp-title{font-size:20px;font-weight:900;}
.imp-box{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;}
.imp-lbl{font-size:13px;font-weight:700;color:var(--txt2);}
.imp-input{background:var(--bg);border:1px solid var(--bdr);border-radius:10px;padding:12px;color:var(--txt);font-family:var(--f);font-size:14px;width:100%;transition:border-color .2s;}
.imp-input:focus{outline:none;border-color:var(--acc);}
.file-drop{border:2px dashed var(--bdr);border-radius:14px;padding:28px 16px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg);}
.file-drop:hover,.file-drop.drag{border-color:var(--acc);background:rgba(200,240,58,.05);}
.file-drop-icon{font-size:36px;display:block;margin-bottom:8px;}
.file-drop-text{font-size:14px;font-weight:700;color:var(--txt2);}
.file-drop-sub{font-size:11px;color:var(--txt2);margin-top:4px;opacity:.7;}
.file-name-display{font-size:12px;color:var(--acc);margin-top:6px;font-weight:700;}
.hint-box{background:rgba(200,240,58,.06);border:1px solid rgba(200,240,58,.2);border-radius:10px;padding:12px;font-size:12px;color:var(--txt2);line-height:1.7;}
.hint-box code{color:var(--acc);background:rgba(200,240,58,.1);padding:1px 6px;border-radius:4px;}
.pri-btn{background:var(--acc);color:#000;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:900;cursor:pointer;font-family:var(--f);width:100%;transition:transform .15s,opacity .2s;}
.pri-btn:active{transform:scale(.97);}
.pri-btn:disabled{opacity:.4;cursor:not-allowed;}

/* ── GAME ── */
#game{background:var(--bg);height:100vh;height:100dvh;overflow:hidden;}
.game-hdr{display:flex;align-items:center;justify-content:space-between;padding:max(8px,env(safe-area-inset-top,8px)) 12px 8px;background:var(--sur);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:100;gap:8px;min-height:42px;}
.game-hdr-inner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:1;}
.game-back{background:none;border:none;color:var(--txt2);font-size:22px;cursor:pointer;padding:4px 6px;font-family:var(--f);flex-shrink:0;line-height:1;}
.game-info{text-align:center;flex:1;}
.game-mode-name{font-size:10px;font-weight:700;color:var(--txt2);letter-spacing:1px;text-transform:uppercase;line-height:1.2;}
.game-prog{font-size:12px;font-weight:800;color:var(--txt);margin-top:1px;line-height:1.2;}

/* ── SCENE ── */
.scene{height:220px;position:relative;overflow:hidden;background:var(--sur);border-bottom:1px solid var(--bdr);flex-shrink:0;}

/* study: boxing ring */
.scene.study-sc{background:linear-gradient(180deg,#1a0a2e,#0d0518);}
.ring-floor{position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(180deg,#2a1a4a,#1a0d2e);border-top:2px solid #4a2a7a;}
.ring-rope{position:absolute;left:8px;right:8px;height:2px;background:rgba(255,100,100,.4);border-radius:1px;}

/* race: ocean */
.scene.race-sc{background:linear-gradient(180deg,#051525,#0a2040);}
.wave{position:absolute;bottom:0;left:0;right:0;height:50px;background:linear-gradient(180deg,transparent,rgba(74,158,255,.15));animation:waveAnim 3s ease-in-out infinite;}
@keyframes waveAnim{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.1)}}

/* dictation: city street */
.scene.dict-sc{background:linear-gradient(180deg,#0a0a1a,#141428);}
.street{position:absolute;bottom:0;left:0;right:0;height:30px;background:#1e1e3a;border-top:2px solid #2a2a4a;}
.street-line{position:absolute;bottom:12px;height:3px;background:rgba(255,200,0,.3);border-radius:1px;animation:roadAnim 1s linear infinite;}
@keyframes roadAnim{from{left:-60px}to{left:calc(100% + 60px)}}

/* survival: arena */
.scene.surv-sc{background:radial-gradient(ellipse at center,#1a0505,#0d0000);}
.arena-floor{position:absolute;bottom:0;left:0;right:0;height:35px;background:linear-gradient(180deg,#2a0a0a,#1a0505);border-top:2px solid #4a0a0a;}

/* CAT character */
.cat-char{position:absolute;font-size:40px;transition:left .4s cubic-bezier(.34,1.56,.64,1),bottom .3s;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6));}
.cat-char.punch{animation:catPunch .35s ease;}
.cat-char.hit{animation:catHit .35s ease;}
.cat-char.ko{animation:catKO .5s ease forwards;}
.cat-char.idle{animation:catIdle 2s ease-in-out infinite;}
@keyframes catPunch{0%{transform:translateX(-50%) scale(1)}30%{transform:translateX(calc(-50% + 20px)) scale(1.3) rotate(-10deg)}60%{transform:translateX(calc(-50% + 8px)) scale(1.1)}100%{transform:translateX(-50%) scale(1)}}
@keyframes catHit{0%{transform:translateX(-50%)}20%{transform:translateX(calc(-50% - 16px)) rotate(-20deg) scale(.9)}100%{transform:translateX(-50%) rotate(0) scale(1)}}
@keyframes catKO{0%{transform:translateX(-50%) rotate(0)}100%{transform:translateX(-50%) rotate(90deg) translateY(20px);opacity:.4}}
@keyframes catIdle{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}

/* enemy cat (for boxing mode) */
.enemy-char{position:absolute;font-size:44px;right:18%;bottom:55px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6)) scaleX(-1);transform:scaleX(-1);}
.enemy-char.enemy-hit{animation:enemyHit .4s ease;}
.enemy-char.enemy-idle{animation:enemyIdle 2.1s ease-in-out infinite;}
@keyframes enemyHit{0%{transform:scaleX(-1)}20%{transform:scaleX(-1) translateX(-20px) rotate(20deg) scale(.85)}100%{transform:scaleX(-1)}}
@keyframes enemyIdle{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-3px)}}

/* HP bars */
.hp-bars{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:8px;align-items:center;}
.hp-wrap{flex:1;}
.hp-label{font-size:9px;font-weight:800;color:var(--txt2);margin-bottom:2px;}
.hp-bar{height:8px;background:var(--bdr);border-radius:4px;overflow:hidden;}
.hp-fill{height:100%;border-radius:4px;transition:width .4s;}
.hp-fill.player{background:linear-gradient(90deg,var(--acc),#90ff00);}
.hp-fill.enemy{background:linear-gradient(90deg,var(--red),var(--ora));}
.hp-vs{font-size:14px;font-weight:900;color:var(--txt2);}

/* RACE scene */
.rank-disp{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);border:1px solid var(--bdr);border-radius:20px;padding:4px 16px;font-size:13px;font-weight:800;color:var(--acc);white-space:nowrap;z-index:10;}
.sc-track{position:absolute;bottom:28px;left:16px;right:16px;height:6px;background:var(--bdr);border-radius:3px;}
.sc-fill{height:100%;border-radius:3px;transition:width .4s cubic-bezier(.34,1.56,.64,1);}
.sc-marker{position:absolute;bottom:18px;transform:translateX(-50%);font-size:26px;transition:left .45s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));}
.poop{position:absolute;font-size:22px;animation:poopFall 1s ease-in forwards;pointer-events:none;z-index:50;}
@keyframes poopFall{0%{top:-30px;opacity:1;transform:rotate(0)}80%{opacity:1}100%{top:95px;opacity:0;transform:rotate(400deg)}}

/* DICTATION scene */
.chase-track{position:absolute;bottom:24px;left:12px;right:12px;height:4px;background:var(--bdr);border-radius:2px;}
.chase-char{position:absolute;bottom:16px;font-size:26px;transform:translateX(-50%);transition:left .5s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));}
.chase-tip{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--txt2);font-weight:700;white-space:nowrap;}

/* SURVIVAL scene */
.surv-cat{position:absolute;font-size:44px;left:50%;bottom:38px;transform:translateX(-50%);filter:drop-shadow(0 4px 12px rgba(255,77,109,.4));}
.lives-row{display:flex;gap:4px;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);}
.life{font-size:18px;transition:all .3s;}
.life.lost{filter:grayscale(1) opacity(.25);transform:scale(.7);}

/* timer bar */
.timer-bar-wrap{height:4px;background:var(--bdr);position:relative;overflow:hidden;}
.timer-bar-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--ora));transition:width .1s linear;border-radius:0 2px 2px 0;}

/* WORD CARD */
.game-scroll{flex:1;overflow-y:auto;padding-bottom:8px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch;}
.word-card{margin:10px 14px 8px;background:var(--sur);border:1px solid var(--bdr);border-radius:16px;padding:14px;text-align:center;position:relative;overflow:hidden;flex-shrink:0;}
.word-card::after{content:'';position:absolute;inset:0;border-radius:16px;opacity:0;transition:opacity .3s;pointer-events:none;}
.word-card.flash-correct::after{background:radial-gradient(ellipse,rgba(200,240,58,.25),transparent 70%);opacity:1;animation:flashC .5s forwards;}
.word-card.flash-wrong::after{background:radial-gradient(ellipse,rgba(255,77,109,.2),transparent 70%);opacity:1;animation:flashW .5s forwards;}
@keyframes flashC{0%{opacity:1}100%{opacity:0}}
@keyframes flashW{0%{opacity:1}100%{opacity:0}}
.word-fr{font-size:26px;font-weight:900;color:var(--acc);letter-spacing:-.5px;line-height:1.2;}
.word-hidden{font-size:26px;color:var(--txt2);letter-spacing:4px;}
.word-row{display:flex;align-items:center;justify-content:center;gap:10px;}
.audio-btn{background:none;border:none;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:8px;transition:transform .15s;}
.audio-btn:active{transform:scale(.82);}

/* OPTIONS */
.options{padding:0 14px;display:flex;flex-direction:column;gap:7px;flex-shrink:0;}
.opt-btn{background:var(--sur);border:2px solid var(--bdr);border-radius:12px;padding:11px 14px;text-align:left;color:var(--txt);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;font-family:var(--f);line-height:1.35;display:flex;align-items:center;gap:10px;width:100%;}
.opt-btn:disabled{cursor:default;}
.opt-letter{width:24px;height:24px;border-radius:6px;background:var(--bdr);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0;transition:all .15s;}
.opt-btn.correct{border-color:var(--acc);background:rgba(200,240,58,.08);}
.opt-btn.correct .opt-letter{background:var(--acc);color:#000;}
.opt-btn.wrong{border-color:var(--red);background:rgba(255,77,109,.08);}
.opt-btn.wrong .opt-letter{background:var(--red);color:#fff;}
.opt-btn.dim{border-color:var(--bdr);opacity:.3;}
.hes-btn{margin:8px 14px 0;background:none;border:1px solid var(--bdr);border-radius:10px;padding:8px;color:var(--red);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--f);width:calc(100% - 28px);transition:all .2s;flex-shrink:0;}
.hes-btn:hover{background:rgba(255,77,109,.08);border-color:var(--red);}
.hes-btn:disabled{opacity:.3;cursor:default;}

/* FLASHCARD */
.flashcard-container{perspective:1000px;width:100%;min-height:300px;display:flex;align-items:center;justify-content:center;}
.flashcard{position:relative;width:100%;min-height:280px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.5,0,.3,1.2);}
.flashcard.flipped{transform:rotateY(180deg);}
.fc-side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;border-radius:18px;gap:8px;}
.fc-front{background:linear-gradient(135deg,#1a2030,#0d1320);border:2px solid var(--bdr);}
.fc-back{background:linear-gradient(135deg,#0d2818,#082010);border:2px solid #4a7a4a;transform:rotateY(180deg);}
.fc-tree-pattern{font-size:18px;letter-spacing:8px;opacity:.55;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));}
.fc-buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 20px;margin-top:12px;}
.fc-btn{padding:16px 8px;border:2px solid var(--bdr);border-radius:14px;background:var(--sur);color:var(--txt);font-family:var(--f);font-weight:800;font-size:13px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:4px;}
.fc-btn:active{transform:scale(.95);}
.fc-know{border-color:var(--acc);}.fc-know:hover{background:rgba(200,240,58,.1);}
.fc-hes{border-color:var(--ora);}.fc-hes:hover{background:rgba(255,159,28,.1);}
.fc-no{border-color:var(--red);}.fc-no:hover{background:rgba(255,77,109,.1);}
.fc-next-btn{margin:8px 20px;padding:16px;background:var(--acc);color:#000;border:none;border-radius:14px;font-size:15px;font-weight:900;cursor:pointer;font-family:var(--f);width:calc(100% - 40px);transition:transform .15s;}
.fc-next-btn:active{transform:scale(.97);}
.fc-next-btn-inline{padding:18px;background:var(--acc);color:#000;border:none;border-radius:14px;font-size:16px;font-weight:900;cursor:pointer;font-family:var(--f);width:100%;transition:transform .15s;}
.fc-next-btn-inline:active{transform:scale(.97);}

/* SPELL */
.spell-input-wrap{margin:18px 20px 0;display:flex;gap:8px;}
.spell-input{flex:1;background:var(--sur);border:2px solid var(--ora);border-radius:14px;padding:14px 16px;color:var(--acc);font-size:20px;font-weight:800;font-family:Georgia,serif;text-align:center;outline:none;font-family:var(--f);}
.spell-input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(200,240,58,.15);}
.spell-submit{background:var(--ora);color:#000;border:none;border-radius:14px;padding:0 22px;font-size:14px;font-weight:900;cursor:pointer;font-family:var(--f);}
.spell-submit:active{transform:scale(.96);}
.spell-submit:disabled{opacity:.5;}

/* EFFECTS */
.light-burst{position:fixed;pointer-events:none;z-index:990;animation:burstAnim .5s ease-out forwards;}
@keyframes burstAnim{0%{opacity:1;transform:translate(-50%,-50%) scale(0)}60%{opacity:.8;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
.combo-pop{position:fixed;top:28%;left:50%;transform:translateX(-50%);font-size:26px;font-weight:900;color:var(--acc);pointer-events:none;z-index:998;animation:cPop .85s forwards;text-shadow:0 0 20px var(--acc);}
@keyframes cPop{0%{opacity:0;transform:translateX(-50%) scale(.4)}25%{opacity:1;transform:translateX(-50%) scale(1.3)}100%{opacity:0;transform:translateX(-50%) translateY(-50px) scale(1)}}
.score-pop{position:absolute;font-size:15px;font-weight:900;pointer-events:none;animation:sPop .8s forwards;z-index:60;}
@keyframes sPop{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px) scale(1.3)}}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);background:rgba(10,10,20,.95);border:1px solid var(--bdr);border-radius:16px;padding:12px 24px;font-size:18px;font-weight:900;opacity:0;pointer-events:none;z-index:999;transition:all .2s;text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.screen-flash{position:fixed;inset:0;pointer-events:none;z-index:980;opacity:0;}
.screen-flash.go{animation:sFlash .3s ease-out forwards;}
@keyframes sFlash{0%{opacity:.4}100%{opacity:0}}
.confetti-piece{position:fixed;border-radius:2px;pointer-events:none;z-index:999;animation:confFall var(--dur) ease-in var(--delay) forwards;}
@keyframes confFall{0%{opacity:1;transform:rotate(0) translateX(0)}100%{top:110vh;opacity:0;transform:rotate(720deg) translateX(var(--drift))}}

/* RESULT */
.result-overlay{position:fixed;inset:0;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:200;padding:28px;animation:fadeIn .35s;}

<script>
// ══════════════════════════════════════
//  AUDIO ENGINE (Web Audio API)
// ══════════════════════════════════════
let AudioCtx = null;
function getACtx(){ if(!AudioCtx) AudioCtx = new (window.AudioContext||window.webkitAudioContext)(); return AudioCtx; }

function playTone(freq, type='sine', dur=0.12, vol=0.3, delay=0){
  try{
    const ctx=getACtx();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type=type; osc.frequency.value=freq;
    const t=ctx.currentTime+delay;
    gain.gain.setValueAtTime(vol,t);
    gain.gain.exponentialRampToValueAtTime(0.001,t+dur);
    osc.start(t); osc.stop(t+dur+0.01);
  }catch(e){}
}

function sfxCorrect(){
  playTone(523,'sine',.08,.25,0);
  playTone(659,'sine',.08,.25,.09);
  playTone(784,'sine',.12,.3,.18);
}
function sfxWrong(){
  playTone(200,'sawtooth',.15,.3,0);
  playTone(150,'sawtooth',.1,.2,.12);
}
function sfxCombo(n){
  // escalating arpeggio
  const freqs=[523,659,784,1047,1319];
  const f=freqs[Math.min(n-2,4)];
  playTone(f,'sine',.06,.2,0);
  playTone(f*1.25,'sine',.06,.25,.07);
  playTone(f*1.5,'sine',.1,.35,.14);
  if(n>=5) playTone(f*2,'sine',.15,.4,.22);
}
function sfxHesitant(){ playTone(440,'triangle',.1,.2,0); }
function sfxResult(win){
  if(win){
    [523,659,784,1047].forEach((f,i)=>playTone(f,'sine',.15,.3,i*.12));
  } else {
    playTone(220,'sawtooth',.3,.3,0);
  }
}

// ══════════════════════════════════════
//  DATA
// ══════════════════════════════════════
let DB = { books:[], selBook:null, groupSize:15 };
function saveDB(){ try{ localStorage.setItem('ecouteCherie2',JSON.stringify(DB)); }catch(e){} }
function loadDB(){ try{ const r=localStorage.getItem('ecouteCherie2'); if(r) DB=JSON.parse(r); if(!DB.groupSize) DB.groupSize=15; if(!DB.books) DB.books=[]; }catch(e){} }
loadDB();
function getBook(id){ return DB.books.find(b=>b.id===id); }
function curBook(){ return getBook(DB.selBook); }

// ══════════════════════════════════════
//  FILE PARSING
// ══════════════════════════════════════
let pendingWords=[];

function handleDrop(e){
  e.preventDefault(); document.getElementById('file-drop').classList.remove('drag');
  const f=e.dataTransfer.files[0]; if(f) processFile(f);
}
function handleFileSelect(e){ const f=e.target.files[0]; if(f) processFile(f); }

function processFile(file){
  document.getElementById('fname-display').textContent='📄 '+file.name;
  const reader=new FileReader();
  if(file.name.toLowerCase().endsWith('.csv')){
    reader.onload=ev=>parseCSV(ev.target.result);
    reader.readAsText(file,'UTF-8');
  } else {
    reader.onload=ev=>parseXLSX(ev.target.result);
    reader.readAsArrayBuffer(file);
  }
}
function parseXLSX(buf){
  try{
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    extractWords(XLSX.utils.sheet_to_json(ws,{header:1,defval:''}));
  }catch(e){ impMsg('⚠️ 解析失败: '+e.message,false); }
}
function parseCSV(text){
  const rows=text.split('\n').filter(l=>l.trim()).map(l=>{
    const parts=l.includes('\t')?l.split('\t'):l.split(',');
    return parts.map(p=>p.trim().replace(/^"|"$/g,''));
  });
  extractWords(rows);
}
function extractWords(rows){
  pendingWords=[];
  let skipped=0;
  rows.forEach((row,i)=>{
    if(!row||row.length<2) return;
    const fr=String(row[0]||'').trim(), zh=String(row[1]||'').trim();
    if(!fr||!zh) return;
    if(i===0&&(fr.toLowerCase().includes('français')||fr.toLowerCase().includes('法语')||fr.toLowerCase()==='french'||fr.toLowerCase()==='mot')) { skipped++; return; }
    pendingWords.push({id:Date.now()+i,fr,zh,seenCount:0,masteryCount:0});
  });
  if(!pendingWords.length){ impMsg('⚠️ 没识别到词条，检查格式',false); document.getElementById('imp-btn').disabled=true; }
  else { impMsg(`✅ 识别到 ${pendingWords.length} 词，跳过 ${skipped} 行`,true); document.getElementById('imp-btn').disabled=false; }
}
function impMsg(txt,ok){
  const el=document.getElementById('imp-msg');
  el.textContent=txt; el.style.color=ok?'var(--acc)':'var(--red)';
}
function doImport(){
  const name=document.getElementById('vname').value.trim();
  if(!name){ impMsg('⚠️ 请输入生词本名称',false); return; }
  if(!pendingWords.length){ impMsg('⚠️ 请先上传文件',false); return; }
  const book={id:Date.now(),name,words:pendingWords,errors:[],hesitants:[]};
  DB.books.push(book); DB.selBook=book.id; saveDB();
  pendingWords=[];
  document.getElementById('vname').value='';
  document.getElementById('fname-display').textContent='';
  document.getElementById('imp-btn').disabled=true;
  document.getElementById('imp-msg').textContent='';
  document.getElementById('xlsx-file').value='';
  showHome(); showToast(`导入成功：${book.words.length} 词 🎉`);
}

// ══════════════════════════════════════
//  HOME
// ══════════════════════════════════════
function showImport(){ switchScreen('import-screen'); }
function showHome(){ switchScreen('home'); renderHome(); }

function renderHome(){
  let total=0,done=0,err=0,hes=0;
  DB.books.forEach(b=>{ total+=b.words.length; done+=b.words.filter(w=>w.masteryCount>=3).length; err+=b.errors.length; hes+=b.hesitants.length; });
  document.getElementById('st-total').textContent=total;
  document.getElementById('st-done').textContent=done;
  document.getElementById('st-err').textContent=err;
  document.getElementById('st-hes').textContent=hes;
  document.getElementById('gp-num').textContent=DB.groupSize;
  const list=document.getElementById('vocab-list');
  list.innerHTML='';
  DB.books.forEach(book=>{
    const d=book.words.filter(w=>w.masteryCount>=3).length;
    const pct=book.words.length?Math.round(d/book.words.length*100):0;
    const div=document.createElement('div');
    div.className='vocab-card'+(DB.selBook===book.id?' sel':'');
    div.innerHTML=`<div class="vc-top"><div class="vc-name">${book.name}</div><div class="vc-cnt">${book.words.length}词·${pct}%</div></div>
      <div class="vc-bar"><div class="vc-fill" style="width:${pct}%"></div></div>
      <div class="vc-tags">
        ${book.errors.length?`<span class="tag e">错词 ${book.errors.length}</span>`:''}
        ${book.hesitants.length?`<span class="tag h">犹豫 ${book.hesitants.length}</span>`:''}
        ${d?`<span class="tag d">已掌握 ${d}</span>`:''}
      </div>`;
    div.onclick=()=>selBook(book.id,div);
    list.appendChild(div);
  });
  const has=DB.books.length>0&&DB.selBook&&curBook();
  ['btn-study','btn-race','btn-dictation','btn-survival','btn-flashcard','btn-spell'].forEach(id=>{ document.getElementById(id).disabled=!has; });
}
function selBook(id,el){
  DB.selBook=id; saveDB();
  document.querySelectorAll('.vocab-card').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel'); renderHome();
}
function chgGroup(d){ DB.groupSize=Math.min(30,Math.max(15,DB.groupSize+d)); saveDB(); document.getElementById('gp-num').textContent=DB.groupSize; }

// ══════════════════════════════════════
//  AUDIO TTS (有道女声 + iOS Audrey回退)
// ══════════════════════════════════════
let curWord='';
let _currentAudio=null;
let _frVoice=null;
let _voicesLoaded=false;
let _youdaoFailCount=0;

function initVoices(){
  if(!window.speechSynthesis) return;
  const pick=()=>{
    const voices=speechSynthesis.getVoices();
    const fr=voices.filter(v=>v.lang.startsWith('fr'));
    if(!fr.length) return;
    const priority=[
      fr.find(v=>/audrey/i.test(v.name)),
      fr.find(v=>/amelie|amélie/i.test(v.name)),
      fr.find(v=>/virginie|julie|claire|marie|chantal/i.test(v.name)),
      fr.find(v=>!/thomas|nicolas|compact/i.test(v.name)),
      fr[0]
    ];
    _frVoice=priority.find(v=>v)||null;
    _voicesLoaded=true;
  };
  pick();
  speechSynthesis.onvoiceschanged=()=>{ pick(); };
}

function playAudio(w){
  const word=w||curWord; if(!word) return;
  // stop previous
  if(_currentAudio){ try{ _currentAudio.pause(); }catch(e){} _currentAudio=null; }
  // try Youdao first (only if not too many failures)
  if(_youdaoFailCount<3){
    const url=`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&le=fr`;
    const audio=new Audio(url);
    _currentAudio=audio;
    let played=false;
    audio.addEventListener('playing',()=>{ played=true; _youdaoFailCount=0; });
    audio.addEventListener('error',e=>{
      console.warn('[Youdao TTS error]', e, audio.error);
      if(!played){ _youdaoFailCount++; speakTTS(word); }
    });
    audio.play().catch(err=>{
      console.warn('[Youdao TTS play() rejected]', err);
      _youdaoFailCount++;
      speakTTS(word);
    });
  } else {
    speakTTS(word);
  }
}

function speakTTS(word){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word);
  u.lang='fr-FR'; u.rate=0.88; u.pitch=1.05;
  if(_frVoice) u.voice=_frVoice;
  else if(!_voicesLoaded){
    setTimeout(()=>{ initVoices(); playAudio(word); },300);
    return;
  }
  speechSynthesis.speak(u);
}

initVoices();

// ══════════════════════════════════════
//  GAME ENGINE
// ══════════════════════════════════════
let G={};

function shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }

function getOpts(correct,pool){
  const others=shuffle(pool.filter(w=>w.id!==correct.id)).slice(0,3);
  return shuffle([correct,...others]);
}

// per-mode pool sizes
const MODE_SIZE={ study:null, race:null, dictation:9, survival:null }; // null = handled separately

function startGame(mode){
  const book=curBook(); if(!book) return;
  if(book.words.length<4){ showToast('至少需要4个词！⚠️'); return; }

  let pool;
  if(mode==='study'){
    const unseen=book.words.filter(w=>w.seenCount===0);
    const seen=book.words.filter(w=>w.seenCount>0&&w.masteryCount<3);
    const mastered=book.words.filter(w=>w.masteryCount>=3);
    pool=[...shuffle(unseen),...shuffle(seen),...shuffle(mastered)].slice(0,DB.groupSize);
  } else if(mode==='dictation'){
    // random 15-30 each time
    const dictCount=15+Math.floor(Math.random()*16);
    pool=shuffle(book.words).slice(0,dictCount);
  } else if(mode==='survival'){
    // exactly 9 words, 8 seconds each
    pool=shuffle(book.words).slice(0,9);
  } else if(mode==='flashcard'){
    // use up to 30 words, prioritize unseen
    const unseen=book.words.filter(w=>w.seenCount===0);
    const seen=book.words.filter(w=>w.seenCount>0);
    pool=[...shuffle(unseen),...shuffle(seen)].slice(0,Math.min(30,book.words.length));
  } else if(mode==='spell'){
    // only single words (no spaces), random 15-30
    const singleWords=book.words.filter(w=>!w.fr.trim().includes(' ')&&!w.fr.includes("'"));
    if(singleWords.length<4){ showToast('单个词不足4个，无法拼写！⚠️'); return; }
    const spellCount=15+Math.floor(Math.random()*16);
    pool=shuffle(singleWords).slice(0,Math.min(spellCount,singleWords.length));
  } else {
    // race: infinite — use full shuffled book, will cycle
    pool=shuffle(book.words);
  }
  if(pool.length<4&&mode!=='spell'){ showToast('词库不足4个词！'); return; }

  G={
    mode, bookId:book.id, pool, allWords:book.words,
    current:0, answered:false, combo:0, maxCombo:0,
    wrongIds:new Set(), hesitantIds:new Set(),
    reviewQueue:[], inReview:false,
    gameEnded:false,
    // race
    rank:200+Math.floor(Math.random()*50), totalAnswered:0,
    // survival
    lives:9, survTotal:0,
    // dictation
    thiefPos:30, policePos:4,
    // boxing HP
    playerHP:100, enemyHP:100,
    // timer
    timerInterval:null, timeLeft:0,
    // spell
    spellAttempts:0,
  };

  switchScreen('game');
  setupScene(mode);
  renderQ();
  initGamepad();
}

// ── SCENE ──
function setupScene(mode){
  const names={study:'🥊 背单词',race:'🐉 赛龙舟',dictation:'🚔 警察追小偷',survival:'🐈 生存',flashcard:'🌲 翻牌',spell:'✍️ 拼写'};
  document.getElementById('g-mode-lbl').textContent=names[mode]||mode;
  const scene=document.getElementById('g-scene');
  // reset scene display (may have been hidden in previous mode)
  scene.style.display='';
  scene.style.background='';

  if(mode==='study'){
    scene.className='scene study-sc';
    scene.innerHTML=`
      <div class="hp-bars">
        <div class="hp-wrap">
          <div class="hp-label">🐱 你</div>
          <div class="hp-bar"><div class="hp-fill player" id="hp-player" style="width:100%"></div></div>
        </div>
        <div class="hp-vs">VS</div>
        <div class="hp-wrap">
          <div class="hp-label" style="text-align:right">对手 😾</div>
          <div class="hp-bar"><div class="hp-fill enemy" id="hp-enemy" style="width:100%"></div></div>
        </div>
      </div>
      <div class="ring-rope" style="top:90px"></div>
      <div class="ring-rope" style="top:104px"></div>
      <div class="ring-floor"></div>
      <div class="cat-char idle" id="cat-m" style="left:22%;bottom:55px;transform:translateX(-50%)">🐱</div>
      <div class="enemy-char enemy-idle" id="enemy-m" style="bottom:60px">😾</div>
      <div class="score-pop" id="dmg-pop" style="display:none"></div>`;
  } else if(mode==='race'){
    scene.className='scene race-sc';
    scene.innerHTML=`
      <div class="wave"></div>
      <div class="rank-disp" id="rank-lbl">🏆 第 ${G.rank} 名</div>
      <div class="sc-track">
        <div class="sc-fill" id="sc-fill" style="background:var(--acc2);width:0%"></div>
      </div>
      <div class="sc-marker" id="boat-m" style="left:4%">🚣</div>`;
    G.poopTimer=setInterval(maybeDropPoop,3500+Math.random()*3500);
  } else if(mode==='dictation'){
    scene.className='scene dict-sc';
    scene.innerHTML=`
      <div class="street"></div>
      <div class="street-line" style="width:40px;top:auto;bottom:8px;left:-60px"></div>
      <div class="chase-tip">警车匀速逼近 · 答对小偷快跑</div>
      <div class="chase-track"></div>
      <div class="chase-char" id="thief-c" style="left:30%">🏃</div>
      <div class="chase-char" id="police-c" style="left:4%">🚔</div>`;
    // police advances 1 unit every 3 seconds
    G.thiefPos=30; G.policePos=4;
    G.policeTimer=setInterval(()=>{
      if(G.policePos<G.thiefPos+3){
        G.policePos=Math.min(95,G.policePos+1.5);
        updateChase();
        playTone(180,'sawtooth',.08,.1,0);
        if(G.policePos>=G.thiefPos){
          // caught!
          clearInterval(G.policeTimer);
          setTimeout(()=>{ if(!G.gameEnded){ G.gameEnded=true; showResult(false,'警车追上了 🚔'); } },300);
        }
      }
    },3000);
  } else if(mode==='survival'){
    scene.className='scene surv-sc';
    scene.innerHTML=`
      <div class="arena-floor"></div>
      <div class="surv-cat" id="surv-cat">🐈</div>
      <div class="lives-row" id="lives-row"></div>`;
    renderLives();
  } else if(mode==='flashcard'){
    scene.className='scene';
    scene.style.display='none';
  } else if(mode==='spell'){
    scene.className='scene';
    scene.style.display='none';
  }

  // timer bar: dictation & survival
  document.getElementById('timer-bar').style.width='100%';
  document.getElementById('timer-bar').style.background=
    (mode==='dictation'||mode==='survival')?'linear-gradient(90deg,var(--red),var(--ora))':'transparent';
}

function renderLives(){
  const d=document.getElementById('lives-row'); if(!d) return;
  d.innerHTML='';
  for(let i=0;i<9;i++){
    const s=document.createElement('span'); s.className='life'+(i>=G.lives?' lost':'');
    s.textContent='🐾'; d.appendChild(s);
  }
}

// ── QUESTION ──
function renderQ(){
  // for infinite modes, cycle pool
  if((G.mode==='race'||G.mode==='survival')&&G.current>=G.pool.length){
    G.pool=[...G.pool,...shuffle(G.allWords)]; // extend pool
  }

  const queue=G.inReview?G.reviewQueue:G.pool;
  const word=queue[G.current];
  if(!word){ endRound(); return; }

  G.answered=false; curWord=word.fr;
  G.questionStartTime=Date.now();
  clearTimer();

  // route to mode-specific renderer
  if(G.mode==='flashcard'){ renderFlashcard(word); return; }
  if(G.mode==='spell'){ renderSpell(word); return; }

  // ALWAYS rebuild word-card DOM for standard modes (prevents leftover flashcard/spell DOM)
  document.getElementById('word-card').innerHTML=`<div class="word-row">
    <div id="word-disp" class="word-fr"></div>
    <button class="audio-btn" onclick="playAudio()">🔊</button>
  </div>`;
  document.getElementById('opts').style.display='flex';
  document.getElementById('hes-btn').style.display='block';

  // progress text
  if(G.mode==='race') document.getElementById('g-prog').textContent=`第${G.rank}名 · 答${G.totalAnswered}题`;
  else if(G.mode==='survival') document.getElementById('g-prog').textContent=`${G.current+1}/${G.pool.length} · 8秒`;
  else if(G.inReview) document.getElementById('g-prog').textContent=`复习 ${G.current+1}/${G.reviewQueue.length}`;
  else document.getElementById('g-prog').textContent=`${G.current+1} / ${G.pool.length}`;

  updateScene(word);

  // word display
  const disp=document.getElementById('word-disp');
  if(G.mode==='dictation'){ disp.textContent='🎧'; disp.className='word-hidden'; }
  else { disp.textContent=word.fr; disp.className='word-fr'; }

  setTimeout(()=>playAudio(word.fr),300);

  // options
  const opts=getOpts(word,G.allWords);
  const container=document.getElementById('opts');
  container.innerHTML='';
  ['A','B','C','D'].forEach((lbl,i)=>{
    const btn=document.createElement('button'); btn.className='opt-btn';
    btn.setAttribute('data-id',opts[i].id);
    btn.innerHTML=`<span class="opt-letter">${lbl}</span><span>${opts[i].zh}</span>`;
    btn.onclick=()=>selectOpt(opts[i],word,btn);
    container.appendChild(btn);
  });

  const hb=document.getElementById('hes-btn'); hb.disabled=false; hb.style.opacity='1';

  // timers: dictation 8s, survival 8s
  if(G.mode==='dictation'||G.mode==='survival') startTimer(8);
}

function updateScene(word){
  if(G.mode==='study'){
    const pHP=G.playerHP, eHP=G.enemyHP;
    const pp=document.getElementById('hp-player'), ep=document.getElementById('hp-enemy');
    if(pp) pp.style.width=pHP+'%';
    if(ep) ep.style.width=eHP+'%';
  } else if(G.mode==='race'){
    const rl=document.getElementById('rank-lbl');
    if(rl) rl.textContent=`🏆 第 ${G.rank} 名`;
    // move boat based on rank progress
    const pct=Math.max(0,Math.min(90,(200-G.rank)/200*90));
    const boat=document.getElementById('boat-m');
    if(boat) boat.style.left=Math.max(4,pct)+'%';
    const fill=document.getElementById('sc-fill');
    if(fill) fill.style.width=pct+'%';
  } else if(G.mode==='dictation'){
    updateChase();
  } else if(G.mode==='survival'){
    renderLives();
  }
}

function updateChase(){
  const t=document.getElementById('thief-c'), p=document.getElementById('police-c');
  if(t) t.style.left=Math.min(92,G.thiefPos)+'%';
  if(p) p.style.left=Math.min(88,G.policePos)+'%';
}

// ── FLASHCARD MODE ──
function renderFlashcard(word){
  document.getElementById('g-prog').textContent=`${G.current+1} / ${G.pool.length}`;
  document.getElementById('opts').style.display='none';
  document.getElementById('hes-btn').style.display='none';
  const wc=document.getElementById('word-card');
  wc.innerHTML=`
    <div class="flashcard-container" id="fc-container">
      <div class="flashcard" id="flashcard">
        <div class="fc-side fc-front">
          <div style="font-size:32px;font-weight:900;color:var(--acc);font-family:Georgia,serif;line-height:1.3;text-align:center;padding:0 12px;">${word.fr}</div>
          <button class="audio-btn" style="margin-top:20px;font-size:28px;" onclick="event.stopPropagation();playAudio()">🔊</button>
        </div>
        <div class="fc-side fc-back">
          <div class="fc-tree-pattern">🌲🌳🌲🌳🌲</div>
          <div style="font-size:22px;font-weight:800;color:#fff;line-height:1.5;text-align:center;padding:0 16px;">${word.zh}</div>
          <div class="fc-tree-pattern">🌳🌲🌳🌲🌳</div>
        </div>
      </div>
    </div>
    <div class="fc-buttons" id="fc-buttons" style="grid-template-columns:1fr 1fr 1fr">
      <button class="fc-btn fc-know" onclick="fcAnswer('know')">
        <div style="font-size:22px;">✅</div><div>认识</div>
      </button>
      <button class="fc-btn fc-hes" onclick="fcAnswer('hesitant')">
        <div style="font-size:22px;">🤔</div><div>犹豫</div>
      </button>
      <button class="fc-btn fc-no" onclick="fcAnswer('unknown')">
        <div style="font-size:22px;">❌</div><div>不认识</div>
      </button>
    </div>
  `;
  setTimeout(()=>playAudio(word.fr),300);
}

function fcAnswer(type){
  if(G.answered) return;
  G.answered=true;
  const word=G.pool[G.current];
  const bw=getBook(G.bookId).words.find(w=>w.id===word.id);
  if(bw) bw.seenCount++;

  if(type==='know'){
    if(bw) bw.masteryCount=Math.min(bw.masteryCount+1,5);
    updateErrStreak(word.id,true);
    sfxCorrect();
    G.totalAnswered++;
  } else if(type==='hesitant'){
    G.hesitantIds.add(word.id);
    addToHesitants(word.id);
    sfxHesitant();
    G.totalAnswered++;
  } else {
    G.wrongIds.add(word.id);
    if(bw) bw.masteryCount=0;
    addToErrors(word.id);
    updateErrStreak(word.id,false);
    sfxWrong();
    G.totalAnswered++;
  }
  saveDB();

  // flip card
  document.getElementById('flashcard').classList.add('flipped');
  // hide buttons, show "tap to next" overlay (full width single column)
  const btns=document.getElementById('fc-buttons');
  btns.style.gridTemplateColumns='1fr';
  btns.innerHTML=`<button class="fc-next-btn-inline" onclick="fcNext()">▶ 下一张</button>`;
}

function fcNext(){
  G.current++;
  if(G.current>=G.pool.length){ endRound(); return; }
  renderQ();
}

// ── SPELL MODE ──
function renderSpell(word){
  document.getElementById('g-prog').textContent=`${G.current+1} / ${G.pool.length}`;
  document.getElementById('opts').style.display='none';
  document.getElementById('hes-btn').style.display='none';
  const wc=document.getElementById('word-card');
  wc.innerHTML=`
    <div style="text-align:center;">
      <div style="font-size:42px;margin-bottom:10px;">🎧</div>
      <button class="audio-btn" style="font-size:30px;background:var(--sur2);border:1px solid var(--bdr);border-radius:50%;width:60px;height:60px;" onclick="playAudio()">🔊</button>
      <div style="font-size:12px;color:var(--txt2);margin-top:12px;font-weight:700;">点击喇叭重听 · 字母大小写不区分 · 口音符号需严格</div>
      <div style="font-size:13px;color:var(--ora);margin-top:8px;font-weight:700;">中文：${word.zh}</div>
    </div>
    <div class="spell-input-wrap">
      <input type="text" id="spell-input" class="spell-input" placeholder="输入法语单词..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="spell-submit" onclick="checkSpell()">提交</button>
    </div>
    <div id="spell-feedback" style="text-align:center;font-size:14px;margin-top:8px;min-height:20px;font-weight:700;"></div>
  `;
  setTimeout(()=>{
    playAudio(word.fr);
    const inp=document.getElementById('spell-input');
    if(inp){
      inp.focus();
      inp.onkeydown=e=>{ if(e.key==='Enter') checkSpell(); };
    }
  },300);
  G.spellAttempts=0;
}

function checkSpell(){
  const inp=document.getElementById('spell-input');
  const fb=document.getElementById('spell-feedback');
  if(!inp) return;
  const word=G.pool[G.current];
  const userAns=inp.value.trim();
  const correct=word.fr.trim();
  // case-insensitive, but accents strict
  const match=userAns.toLowerCase()===correct.toLowerCase();

  if(match){
    G.answered=true;
    const bw=getBook(G.bookId).words.find(w=>w.id===word.id);
    if(bw){ bw.seenCount++; if(G.spellAttempts===0) bw.masteryCount=Math.min(bw.masteryCount+1,5); else bw.masteryCount=Math.max(0,bw.masteryCount-1); }
    if(G.spellAttempts===0){ updateErrStreak(word.id,true); G.combo++; G.maxCombo=Math.max(G.maxCombo,G.combo); }
    else { G.wrongIds.add(word.id); addToErrors(word.id); }
    G.totalAnswered++;
    sfxCorrect();
    fb.style.color='var(--acc)';
    fb.textContent='✅ 正确！'+(G.spellAttempts>0?` (尝试${G.spellAttempts+1}次)`:'');
    inp.disabled=true;
    document.querySelector('.spell-submit').disabled=true;
    lightBurst();
    saveDB();
    setTimeout(()=>{
      G.current++;
      if(G.current>=G.pool.length) endRound();
      else renderQ();
    },1100);
  } else {
    G.spellAttempts++;
    G.combo=0;
    sfxWrong();
    screenShake();
    const bw=getBook(G.bookId).words.find(w=>w.id===word.id);
    if(bw) bw.masteryCount=0;
    G.wrongIds.add(word.id);
    addToErrors(word.id);
    updateErrStreak(word.id,false);
    saveDB();
    // show correct answer for 2s, then clear and let try again
    fb.style.color='var(--red)';
    fb.innerHTML=`❌ 错了 (第${G.spellAttempts}次) · 正确：<span style="color:var(--acc);font-weight:900;">${correct}</span>`;
    inp.disabled=true;
    document.querySelector('.spell-submit').disabled=true;
    setTimeout(()=>{
      if(G.answered) return; // user already moved on somehow
      fb.textContent='请再拼一次...';
      fb.style.color='var(--ora)';
      inp.disabled=false;
      inp.value='';
      document.querySelector('.spell-submit').disabled=false;
      inp.focus();
    },2000);
  }
}

// ── TIMER ──
function startTimer(secs){
  G.timeLeft=secs;
  const bar=document.getElementById('timer-bar');
  G.timerInterval=setInterval(()=>{
    G.timeLeft-=0.1;
    if(bar) bar.style.width=Math.max(0,G.timeLeft/secs*100)+'%';
    if(G.timeLeft<=0){ clearTimer(); timeUp(); }
  },100);
}
function clearTimer(){ if(G.timerInterval){ clearInterval(G.timerInterval); G.timerInterval=null; } }
function timeUp(){
  if(G.answered) return;
  G.answered=true;
  sfxWrong();
  const word=(G.inReview?G.reviewQueue:G.pool)[G.current];
  if(word){
    G.wrongIds.add(word.id); addToErrors(word.id);
    if(G.mode==='survival'){
      G.lives--; renderLives();
      if(G.lives<=0){ saveDB(); setTimeout(()=>showResult(false,`坚持了 ${G.current+1} 题`),700); return; }
    }
  }
  document.querySelectorAll('.opt-btn').forEach(b=>{ b.disabled=true; if(parseInt(b.getAttribute('data-id'))===word?.id) b.classList.add('correct'); else b.classList.add('dim'); });
  showToast('⏰ 时间到！');
  setTimeout(()=>{ G.current++; if(G.current>=G.pool.length) endRound(); else renderQ(); },900);
}

// ── ANSWER ──
function selectOpt(opt,word,btn){
  if(G.answered) return;
  G.answered=true;
  clearTimer();
  const correct=opt.id===word.id;

  document.querySelectorAll('.opt-btn').forEach(b=>{
    const bid=parseInt(b.getAttribute('data-id')); b.disabled=true;
    if(bid===word.id) b.classList.add('correct');
    else if(b===btn&&!correct) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  document.getElementById('hes-btn').disabled=true;

  const bw=getBook(G.bookId).words.find(w=>w.id===word.id);
  if(bw) bw.seenCount++;

  const card=document.getElementById('word-card');

  if(correct){
    G.combo++; G.maxCombo=Math.max(G.maxCombo,G.combo);
    G.totalAnswered++;
    if(bw) bw.masteryCount=Math.min(bw.masteryCount+1,5);
    updateErrStreak(word.id,true);
    // AUTO-DETECT HESITATION: if response > 4 seconds, mark as hesitant
    const responseTime=(Date.now()-G.questionStartTime)/1000;
    if(responseTime>4 && !G.inReview){
      G.hesitantIds.add(word.id);
      addToHesitants(word.id);
      showScorePop('🤔 反应慢','var(--ora)');
    }
    sfxCorrect();
    if(G.combo>=2) setTimeout(()=>sfxCombo(G.combo),250);
    card.classList.add('flash-correct'); setTimeout(()=>card.classList.remove('flash-correct'),500);
    lightBurst();
    if(G.combo>=2) showCombo(G.combo);

    if(G.mode==='study'){
      const dmg=Math.min(G.combo*8+10,25);
      G.enemyHP=Math.max(0,G.enemyHP-dmg);
      catAnim('punch'); enemyAnim('enemy-hit');
      showDmgPop('-'+dmg,'var(--red)',true);
      if(G.enemyHP<=0){ G.enemyHP=0; setTimeout(()=>{ G.enemyHP=100; updateScene(word); showToast('敌人倒下！🥊 +HP'); G.playerHP=Math.min(100,G.playerHP+15); },600); }
    } else if(G.mode==='race'){
      const rg=Math.max(1,Math.floor(3+G.combo*.5));
      G.rank=Math.max(1,G.rank-rg);
      showScorePop('+'+rg+'名','var(--acc)');
    } else if(G.mode==='dictation'){
      // thief escapes further on correct
      G.thiefPos=Math.min(95,G.thiefPos+5); updateChase();
    }

  } else {
    G.combo=0; G.wrongIds.add(word.id);
    G.totalAnswered++;
    if(bw) bw.masteryCount=0;
    addToErrors(word.id); updateErrStreak(word.id,false);
    sfxWrong();
    screenShake();
    card.classList.add('flash-wrong'); setTimeout(()=>card.classList.remove('flash-wrong'),500);

    if(G.mode==='study'){
      const dmg=15;
      G.playerHP=Math.max(0,G.playerHP-dmg);
      catAnim('hit'); showDmgPop('-'+dmg,'var(--red)',false);
      if(G.playerHP<=0){ G.playerHP=0; setTimeout(()=>{ G.playerHP=100; updateScene(word); showToast('被击倒！坚持住！'); },600); }
    } else if(G.mode==='dictation'){
      // thief stays still on wrong (only police advances via timer)
    } else if(G.mode==='survival'){
      G.lives--; G.survTotal=G.totalAnswered; renderLives();
      const sc=document.getElementById('surv-cat'); if(sc){ sc.style.animation='none'; sc.offsetHeight; sc.style.animation='catHit .4s ease'; }
      if(G.lives<=0){ saveDB(); setTimeout(()=>showResult(false),700); return; }
    }
  }

  const ri=document.getElementById('g-right');
  if(ri) ri.textContent=G.combo>=2?`🔥 ${G.combo}连`:'';
  saveDB();

  setTimeout(()=>{
    G.current++;
    const queue=G.inReview?G.reviewQueue:G.pool;
    if(G.current>=queue.length){
      if(!G.inReview&&(G.wrongIds.size>0||G.hesitantIds.size>0)&&G.mode==='study') startReview();
      else endRound();
    } else renderQ();
  },950);
}

function markUnknown(){
  const q=G.inReview?G.reviewQueue:G.pool; const word=q[G.current];
  if(!word||G.answered) return;
  G.answered=true;
  clearTimer();

  // mark as wrong - add to errors
  G.wrongIds.add(word.id);
  G.totalAnswered++;
  G.combo=0;
  const bw=getBook(G.bookId).words.find(w=>w.id===word.id);
  if(bw){ bw.seenCount++; bw.masteryCount=0; }
  addToErrors(word.id);
  updateErrStreak(word.id,false);
  sfxWrong();
  saveDB();

  // highlight correct option, dim others
  document.querySelectorAll('.opt-btn').forEach(b=>{
    const bid=parseInt(b.getAttribute('data-id'));
    b.disabled=true;
    if(bid===word.id) b.classList.add('correct');
    else b.classList.add('dim');
  });
  const hb=document.getElementById('hes-btn'); hb.disabled=true; hb.style.opacity='.4';
  showToast('🚫 不认识·答案见绿框');

  // survival: lose a life
  if(G.mode==='survival'){
    G.lives--; renderLives();
    if(G.lives<=0){ setTimeout(()=>showResult(false,`坚持了 ${G.current+1} 题`),1500); return; }
  }

  // proceed after 2s (longer to read correct answer)
  setTimeout(()=>{
    G.current++;
    const queue=G.inReview?G.reviewQueue:G.pool;
    if(G.current>=queue.length){
      if(!G.inReview&&(G.wrongIds.size>0||G.hesitantIds.size>0)&&G.mode==='study') startReview();
      else endRound();
    } else renderQ();
  },2000);
}

// keep markHesitant as alias for backward compat (used by old code paths)
function markHesitant(){ markUnknown(); }

function startReview(){
  const book=getBook(G.bookId);
  const ids=[...G.wrongIds,...G.hesitantIds];
  G.reviewQueue=shuffle(book.words.filter(w=>ids.includes(w.id)));
  G.inReview=true; G.current=0; G.wrongIds.clear();
  showToast('复习错词和犹豫词 🔁');
  setTimeout(renderQ,900);
}

function endRound(){
  clearTimer();
  if(G.poopTimer) clearInterval(G.poopTimer);
  if(G.policeTimer) clearInterval(G.policeTimer);
  G.gameEnded=true;
  if(G.mode==='dictation') showResult(G.policePos<G.thiefPos, G.policePos>=G.thiefPos?'被抓住了 😵':'成功逃脱！🏃');
  else if(G.mode==='survival') showResult(G.lives>0,G.lives>0?`完成9题！剩${G.lives}条命`:`坚持了 ${G.survTotal} 题`);
  else if(G.mode==='flashcard') showResult(true,`翻完 ${G.pool.length} 张卡`);
  else if(G.mode==='spell') showResult(true,`完成 ${G.pool.length} 词拼写`);
  else showResult(true);
}

// ── ERROR TRACKING ──
function addToErrors(wid){
  const book=getBook(G.bookId); if(!book) return;
  const word=book.words.find(w=>w.id===wid); if(!word) return;
  if(!book.errors.find(e=>e.id===wid)) book.errors.push({...word,streak:0});
}
function addToHesitants(wid){
  const book=getBook(G.bookId); if(!book) return;
  const word=book.words.find(w=>w.id===wid); if(!word) return;
  if(!book.hesitants.find(e=>e.id===wid)) book.hesitants.push({...word,streak:0});
}
function updateErrStreak(wid,correct){
  const book=getBook(G.bookId); if(!book) return;
  ['errors','hesitants'].forEach(key=>{
    const idx=book[key].findIndex(e=>e.id===wid); if(idx===-1) return;
    if(correct){
      book[key][idx].streak=(book[key][idx].streak||0)+1;
      if(book[key][idx].streak>=3){ book[key].splice(idx,1); showToast('移出词本 🎉'); }
    } else book[key][idx].streak=0;
  });
}

// ── RACE POOP ──
function maybeDropPoop(){ if(Math.random()<0.45) dropPoop(); }
function dropPoop(){
  const scene=document.getElementById('g-scene'); if(!scene) return;
  const p=document.createElement('div'); p.className='poop'; p.textContent='💩';
  p.style.left=(8+Math.random()*80)+'%'; scene.appendChild(p);
  if(!G.answered){
    G.rank=Math.min(500,G.rank+Math.floor(1+Math.random()*4));
    const rl=document.getElementById('rank-lbl'); if(rl) rl.textContent=`🏆 第 ${G.rank} 名`;
    showScorePop('💩 掉名次','var(--red)');
    playTone(180,'sawtooth',.1,.15,0);
  }
  setTimeout(()=>p.remove(),1050);
}

// ── ANIMATIONS ──
function catAnim(type){
  const cat=document.getElementById('cat-m'); if(!cat) return;
  cat.className='cat-char'; cat.offsetHeight;
  cat.className='cat-char '+type;
  setTimeout(()=>{ cat.className='cat-char idle'; },500);
}
function enemyAnim(type){
  const en=document.getElementById('enemy-m'); if(!en) return;
  en.className='enemy-char'; en.offsetHeight;
  en.className='enemy-char '+type;
  setTimeout(()=>{ en.className='enemy-char enemy-idle'; },500);
}
function showDmgPop(txt,color,isEnemy){
  const el=document.createElement('div');
  el.style.cssText=`position:absolute;font-size:20px;font-weight:900;color:${color};pointer-events:none;animation:sPop .7s forwards;z-index:60;top:60px;${isEnemy?'right:15%':'left:15%'}`;
  el.textContent=txt;
  const scene=document.getElementById('g-scene'); if(scene){ scene.appendChild(el); setTimeout(()=>el.remove(),750); }
}
function showScorePop(txt,color){
  const scene=document.getElementById('g-scene'); if(!scene) return;
  const el=document.createElement('div'); el.className='score-pop';
  el.textContent=txt; el.style.color=color;
  el.style.left=(20+Math.random()*60)+'%'; el.style.top='18px';
  scene.appendChild(el); setTimeout(()=>el.remove(),900);
}
function lightBurst(){
  const el=document.createElement('div'); el.className='light-burst';
  el.style.cssText=`width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(200,240,58,.5),transparent 70%);left:50%;top:50%;position:fixed;transform:translate(-50%,-50%) scale(0);`;
  document.body.appendChild(el); el.classList.add('light-burst');
  setTimeout(()=>el.remove(),550);
}
function screenShake(){
  const g=document.getElementById('game');
  g.style.animation='none'; g.offsetHeight;
  g.style.animation='shake .3s ease';
  setTimeout(()=>g.style.animation='',350);
}
function showCombo(n){
  const el=document.createElement('div'); el.className='combo-pop';
  const texts={2:'💥 2连击！',3:'🔥 3连击！',4:'⚡ 4连击！',5:'🌟 5连击！'};
  el.textContent=texts[n]||(n+'连击！🚀');
  document.body.appendChild(el); setTimeout(()=>el.remove(),900);
}
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1300);
}
function spawnConfetti(){
  const cols=['#c8f03a','#4af0c8','#a78bfa','#ff9f1c','#4a9eff','#ff4d6d'];
  for(let i=0;i<50;i++){
    const el=document.createElement('div'); el.className='confetti-piece';
    el.style.cssText=`top:0;left:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*cols.length)]};--dur:${.9+Math.random()*1.3}s;--delay:${Math.random()*.5}s;--drift:${(Math.random()-.5)*220}px;width:${6+Math.random()*9}px;height:${6+Math.random()*9}px;transform:rotate(${Math.random()*360}deg);`;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2700);
  }
}

// ── RESULT ──
function showResult(win,subtitle=''){
  clearTimer();
  if(G.poopTimer) clearInterval(G.poopTimer);
  sfxResult(win);
  const book=getBook(G.bookId);
  const errC=book?book.errors.length:0, hesC=book?book.hesitants.length:0;
  const modeEmoji={study:win?'🏆':'😿',race:win?'🏅':'🐉',dictation:win?'🏃':'🚔',survival:win?'🐈':'😿',flashcard:'🌲',spell:'✍️'};
  const modeTitle={
    study: win?'打赢了！':'加油，再来！',
    race: `第 ${G.rank} 名！`,
    dictation: subtitle||'完成！',
    survival: subtitle||`撑了 ${G.survTotal} 题！`,
    flashcard: subtitle||'翻完啦！',
    spell: subtitle||'拼写完成！'
  };
  const root=document.getElementById('result-root');
  root.innerHTML=`<div class="result-overlay">
    <div class="res-emoji">${modeEmoji[G.mode]||'🎉'}</div>
    <div class="res-title">${modeTitle[G.mode]}</div>
    <div class="res-sub">${G.inReview?'含错词复习轮 · 做得很好！':''}</div>
    <div class="res-badge">
      <span class="badge g">答对 ${G.totalAnswered-(G.wrongIds?G.wrongIds.size:0)}</span>
      <span class="badge r">答错 ${G.wrongIds?G.wrongIds.size:0}</span>
      <span class="badge o">犹豫 ${G.hesitantIds?G.hesitantIds.size:0}</span>
      <span class="badge p">最长连击 ${G.maxCombo}</span>
    </div>
    <div class="res-stats">
      ${errC?`<div class="rs"><div class="rs-num" style="color:var(--red)">${errC}</div><div class="rs-lbl">错词本</div></div>`:''}
      ${hesC?`<div class="rs"><div class="rs-num" style="color:var(--ora)">${hesC}</div><div class="rs-lbl">犹豫词本</div></div>`:''}
      ${!errC&&!hesC?'<div style="color:var(--acc);font-weight:800;font-size:14px;">🎉 本生词本无错词和犹豫词！</div>':''}
    </div>
    <button class="res-btn" onclick="restartGame()">再来一组</button>
    <button class="res-btn sec" onclick="exitGame()">返回主页</button>
  </div>`;
  if(win) setTimeout(spawnConfetti,150);
}

function restartGame(){ document.getElementById('result-root').innerHTML=''; startGame(G.mode); }
function exitGame(){
  clearTimer();
  if(G.poopTimer) clearInterval(G.poopTimer);
  if(G.policeTimer) clearInterval(G.policeTimer);
  G.gameEnded=true;
  document.getElementById('result-root').innerHTML='';
  switchScreen('home'); renderHome();
}

// ── GAMEPAD ──
let gpLoop=null, lastBtns=[];
function initGamepad(){
  if(gpLoop) cancelAnimationFrame(gpLoop);
  function loop(){
    const gps=navigator.getGamepads?navigator.getGamepads():[];
    for(const gp of gps){ if(!gp) continue;
      gp.buttons.forEach((btn,i)=>{ if(btn.pressed&&!lastBtns[i]) onGPBtn(i); lastBtns[i]=btn.pressed; }); }
    gpLoop=requestAnimationFrame(loop);
  }
  gpLoop=requestAnimationFrame(loop);
}
function onGPBtn(idx){
  const opts=document.querySelectorAll('.opt-btn:not([disabled])');
  const map={2:0,1:1,3:2,0:3};
  if(map[idx]!==undefined&&opts[map[idx]]) opts[map[idx]].click();
  else if(idx===5) playAudio();
  else if(idx===4){ const hb=document.getElementById('hes-btn'); if(hb&&!hb.disabled) hb.click(); }
}

// ── EXPORT/IMPORT ──
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`EcouteCherie_${new Date().toISOString().slice(0,10)}.json`; a.click();
}
function triggerImportJSON(){ document.getElementById('json-file').click(); }
function loadJSON(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{ try{ const d=JSON.parse(ev.target.result); if(d.books){DB=d;saveDB();renderHome();showToast('进度导入成功 ✅');} }catch(err){showToast('文件格式错误 ⚠️');} };
  reader.readAsText(file);
}

// ── SCREEN ──
function switchScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

// shake keyframe (injected)
const shakeStyle=document.createElement('style');
shakeStyle.textContent='@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}';
document.head.appendChild(shakeStyle);

// ── INIT ──
renderHome();
</script>
